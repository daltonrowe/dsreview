# Name of your application. Used to uniquely configure containers.
# Must be unique across every app deployed to dcloudbox.
service: dsreview

# Name of the container image.
image: daltonrowe/dsreview

# Deploy to these servers.
# The same address also appears as SERVER_ADDR in .github/workflows/cd.yml.
servers:
  web:
    - 162.55.211.252

# kamal-proxy is shared by every app on dcloudbox; each app claims its own host.
# The A record for this host must point at the server before the first deploy
# or Let's Encrypt issuance fails.
#
# Note: If using Cloudflare, set encryption mode in SSL/TLS setting to "Full (strict)".
proxy:
  ssl: true
  # Also in the deploy summary in .github/workflows/cd.yml.
  host: dsreview.daltonrowe.com
  app_port: 3000
  healthcheck:
    path: /up
  # Live collaboration streams server-sent events from /api/live for as long as a tab is open.
  # Buffered responses would hold events back, and the default 30s response timeout would cut
  # every stream (browsers reconnect, but presence would flicker), so stream unbuffered and
  # allow an hour per connection.
  buffering:
    responses: false
  response_timeout: 3600

# Reviewer decisions (DATA_DIR). A named volume survives deploys and rollbacks.
volumes:
  - dsreview_data:/app/data

# Credentials for your image host.
registry:
  server: ghcr.io
  username: daltonrowe

  # Always use an access token rather than real password when possible.
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers. Nothing here is secret: the basic-auth
# password is a shared low-stakes gate, so it is hardcoded.
env:
  clear:
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: 3000
    DATA_DIR: /app/data
    REVIEW_USER: eezy
    REVIEW_PASS: eezy

# Use a different ssh user than root. The bootstrap script creates this user and
# adds it to the docker group.
ssh:
  user: deploy

# Aliases are triggered with "bin/kamal <alias>".
aliases:
  shell: app exec --interactive --reuse "sh"
  logs: app logs -f

# Configure the image builder.
builder:
  arch: amd64
