name: CD

on:
  workflow_dispatch:
  push:
    branches:
      - "master"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Never cancel an in-flight deploy

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run tests
        run: npm test

  deploy_start:
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Notify start
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          SHA: ${{ github.sha }}
        run: |
          curl -X POST "$NOTIFY_WEBHOOK_URL" -H "Content-Type: application/json" \
            -d "{\"content\":\"dsreview CD Deploy Starting - $SHA\"}"

  deploy:
    runs-on: ubuntu-latest
    needs: [test]

    permissions:
      contents: read
      packages: write

    env:
      DOCKER_BUILDKIT: 1
      # Must match servers.web in config/deploy.yml.
      SERVER_ADDR: 162.55.211.252

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby (for the Kamal CLI)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up SSH connection to dcloudbox
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # Kamal picks the key up from the default path, so no ssh-agent is needed.
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Fetch only the ed25519 host key. SSHKit's known_hosts parser matches a
          # single hashed line per host, and with every key type present the first
          # line is sometimes ssh-rsa, which the server no longer negotiates, so the
          # deploy fails with HostKeyMismatch at random.
          ssh-keyscan -t ed25519 "$SERVER_ADDR" >> ~/.ssh/known_hosts

      - name: Deploy with Kamal
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: bin/kamal deploy

      - name: Summarize deploy
        if: always()
        run: |
          echo "### dsreview deploy: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          # Keep in sync with proxy.host in config/deploy.yml
          echo "- host: https://dsreview.daltonrowe.com" >> $GITHUB_STEP_SUMMARY

  deploy_end:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()

    steps:
      - name: Notify end
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          DEPLOY_CONCLUSION: ${{ needs.deploy.result }}
          SHA: ${{ github.sha }}
        run: |
          curl -X POST "$NOTIFY_WEBHOOK_URL" -H "Content-Type: application/json" \
            -d "{\"content\":\"dsreview CD Deploy - $DEPLOY_CONCLUSION - $SHA\"}"
