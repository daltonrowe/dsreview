<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design System Review</title>
<link rel="stylesheet" href="app.css">
<style>
  main { max-width: 1100px; margin: 0 auto; padding: 24px 20px 80px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 10px; font-weight: 600; }
  .surveys { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .survey { display: flex; flex-direction: column; gap: 10px; padding: 16px; text-decoration: none; }
  .survey:hover { border-color: var(--line-2); }
  .survey h3 { margin: 0; font-size: 16px; }
  .survey .meta { font-size: 12px; color: var(--muted); }
  .pages { display: flex; flex-direction: column; }
  .page { display: grid; grid-template-columns: 260px 1fr auto; gap: 14px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .page:last-child { border-bottom: 0; }
  .page .name { font-weight: 550; }
  .page .props { display: flex; flex-wrap: wrap; gap: 4px; }
  .howto { padding: 14px 16px; font-size: 13px; color: var(--muted); }
  .howto code { color: var(--text); }
  .comps { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .comp { display: flex; flex-direction: column; overflow: hidden; }
  .comp .shot { height: 150px; display: flex; align-items: center; justify-content: center; background: var(--checker); border-bottom: 1px solid var(--line); }
  .comp .shot img { max-width: 100%; max-height: 100%; }
  .comp .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; }
  .comp h3 { margin: 0; font-size: 14px; display: flex; gap: 8px; align-items: baseline; }
  .comp h3 .n { color: var(--faint); font-weight: 500; font-size: 12px; }
  .comp .desc { color: var(--muted); }
  .comp .stats { display: flex; gap: 12px; color: var(--muted); font-size: 12px; }
  .comp .stats b { color: var(--text); }
  .comp .rel { font-size: 12px; color: var(--muted); }
  .comp .rel code { color: var(--text); }
  .comp details { font-size: 12px; color: var(--muted); }
  .comp details summary { cursor: pointer; }
  .comp details li { margin: 2px 0; }
  .comp .foot a { font-size: 12px; color: var(--muted); }
  .sec-intro { color: var(--muted); font-size: 12.5px; margin: -4px 0 12px; }
  .catf { margin-bottom: 12px; }
  details.collapse > summary { list-style: none; cursor: pointer; }
  details.collapse > summary::-webkit-details-marker { display: none; }
  details.collapse > summary h2::before { content: '▸'; display: inline-block; width: 14px; transition: transform .15s; }
  details.collapse[open] > summary h2::before { transform: rotate(90deg); }
  @media (max-width: 720px) { .page { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="topbar"><h1>Design System Review</h1><span class="spacer"></span><a class="btn" href="view.html">Open page viewer</a></div>
<main>
  <h2>Token surveys</h2>
  <div id="surveys" class="surveys"></div>
  <details class="collapse" id="compsBox">
    <summary><h2>Suggested Components <span class="faint" id="compsCount"></span></h2></summary>
    <p class="sec-intro">Elements that look alike and recur across the redesign: same kind, size, shape, fill, border and text style. Ranked by distinct uses × pages.</p>
    <div class="seg catf" id="catf"></div>
    <div id="comps" class="comps"></div>
  </details>
  <h2>Pages</h2>
  <div id="pages" class="card pages"></div>
</main>
<script type="module">
import { api, esc, progressBar, legend, viewUrl, $ } from './common.js';

const surveys = await api('/api/surveys');
$('#surveys').innerHTML = surveys.length ? surveys.map(s => s.generated ? `
  <a class="card survey" href="survey.html?id=${encodeURIComponent(s.id)}">
    <h3>${esc(s.title)}</h3>
    <div class="meta"><code>${esc(s.id)}</code> · ${s.stats.sections} sections · ${s.stats.usages} usages · ${new Date(s.generatedAt).toLocaleString()}</div>
    ${progressBar(s.progress)}${legend(s.progress)}
  </a>` : `
  <div class="card survey"><h3>${esc(s.title)}</h3><div class="meta">Not generated yet: <code>node tools/survey.mjs run ${esc(s.id)}</code></div></div>`).join('')
  : `<div class="card howto">No surveys yet. Create one:<br><code>node tools/survey.mjs new radius --preset radius</code><br><code>node tools/survey.mjs run radius</code><br>Presets: <code>node tools/survey.mjs presets</code></div>`;

// ---------- Suggested Components ----------
let comps = null, cat = 'All';
try { comps = await api('/api/components'); } catch { }
function renderComps() {
  if (!comps) { $('#comps').innerHTML = `<div class="card howto">Not generated yet: <code>node tools/components.mjs</code></div>`; return; }
  $('#compsCount').textContent = `(${comps.components.length})`;
  const cats = ['All', ...new Set(comps.components.map(c => c.category))];
  $('#catf').innerHTML = cats.map(c => `<button data-c="${esc(c)}" aria-pressed="${c === cat}">${esc(c)}</button>`).join('');
  const list = comps.components.filter(c => cat === 'All' || c.category === cat);
  $('#comps').innerHTML = list.map((c, i) => {
    const cap = comps.captures[c.example.capture];
    return `<div class="card comp">
      <div class="shot">${c.shot ? `<img loading="lazy" src="/analysis/components/${esc(c.shot)}" alt="">` : ''}</div>
      <div class="body">
        <h3>${esc(c.category)} <span class="n">#${i + 1}</span></h3>
        <div class="desc">${esc(c.description)}</div>
        <div class="stats"><span><b>${c.usages}</b> uses</span><span><b>${c.instances}</b> instances</span><span><b>${c.pages.length}</b> page${c.pages.length === 1 ? '' : 's'}</span></div>
        ${c.examples.length ? `<div class="desc" title="${esc(c.examples.join('\n'))}">“${esc(c.examples.slice(0, 3).join('”, “'))}”</div>` : ''}
        ${c.related.length ? `<div class="rel">Design system: ${c.related.map(r => `<code>${esc(r)}</code>`).join(', ')}</div>` : `<div class="rel">Not in the design system</div>`}
        ${c.variants.length > 1 ? `<details><summary>${c.variants.length} visual variants</summary><ul>${c.variants.map(v => `<li>${esc(v.description)} (${v.usages})</li>`).join('')}</ul></details>` : ''}
        <div class="foot"><a href="${esc(viewUrl(cap, c.example))}" target="_blank">Usage</a> · <span class="faint" title="${esc(c.pages.join(', '))}">${esc(c.pages.slice(0, 3).join(', '))}${c.pages.length > 3 ? '…' : ''}</span></div>
      </div>
    </div>`;
  }).join('');
}
$('#catf').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; cat = b.dataset.c; renderComps(); });
renderComps();

const pages = await api('/api/pages');
$('#pages').innerHTML = pages.map(p => `
  <div class="page">
    <div class="name">${esc(p.file.replace(/\.dc\.html$|\.html$/, ''))}${p.dc ? '' : ' <span class="chip">export</span>'}</div>
    <div class="props">${p.props ? Object.entries(p.props).filter(([, v]) => v.options || v.editor === 'boolean').map(([k, v]) => `<span class="chip" title="${esc((v.options || ['true', 'false']).join(' | '))}">${esc(k)}</span>`).join('') : ''}</div>
    <a class="btn small" href="view.html?page=${encodeURIComponent(p.file)}">View</a>
  </div>`).join('');
</script>
</body>
</html>
