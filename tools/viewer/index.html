<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design vs Live</title>
<link rel="stylesheet" href="app.css">
<style>
  main { max-width: 1180px; margin: 0 auto; padding: 24px 20px 80px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 10px; font-weight: 600; }
  .intro { color: var(--muted); font-size: 13px; margin: 0 0 6px; max-width: 760px; }
  .intro a { color: var(--text); }
  .comps { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; }
  .comp { display: flex; flex-direction: column; overflow: hidden; text-decoration: none; }
  a.comp:hover { border-color: var(--line-2); }
  .thumbs { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); height: 150px; border-bottom: 1px solid var(--line); }
  .thumbs div { background: var(--panel-2) top center / 100% auto no-repeat; position: relative; }
  .thumbs span { position: absolute; left: 6px; bottom: 6px; font-size: 10.5px; font-weight: 600; padding: 1px 6px; border-radius: 999px; color: #fff; }
  .thumbs .d span { background: var(--design); } .thumbs .l span { background: var(--live); }
  .comp .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; }
  .comp h3 { margin: 0; font-size: 16px; }
  .comp .meta { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cats { display: flex; flex-wrap: wrap; gap: 4px; }
  .sev { display: flex; gap: 10px; font-size: 12px; color: var(--muted); }
  .sev b { color: var(--text); }
  .pages { display: flex; flex-direction: column; }
  .page { display: grid; grid-template-columns: 260px 1fr auto; gap: 14px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .page:last-child { border-bottom: 0; }
  .page .name { font-weight: 550; }
  .page .props { display: flex; flex-wrap: wrap; gap: 4px; }
  .howto { padding: 14px 16px; font-size: 13px; color: var(--muted); }
  .howto code { color: var(--text); }
  details.collapse > summary { list-style: none; cursor: pointer; }
  details.collapse > summary::-webkit-details-marker { display: none; }
  details.collapse > summary h2::before { content: '▸'; display: inline-block; width: 14px; transition: transform .15s; }
  details.collapse[open] > summary h2::before { transform: rotate(90deg); }
  @media (max-width: 720px) { .page { grid-template-columns: 1fr; } .comps { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="topbar"><h1>Design vs Live</h1><span class="spacer"></span><a class="btn" href="/api/export.md" download title="Every comparison's findings and decisions in one Markdown file (JSON: /api/export.json)">Export all</a><a class="btn" href="view.html">Design page viewer</a></div>
<main>
  <p class="intro" id="intro"></p>
  <h2>Comparisons</h2>
  <div id="comps" class="comps"></div>
  <details class="collapse" id="pagesBox">
    <summary><h2>Design pages <span class="faint" id="pagesCount"></span></h2></summary>
    <div id="pages" class="card pages"></div>
  </details>
</main>
<script type="module">
import { api, esc, progressBar, legend, $ } from './common.js';
import { startLive, onDecision, liveToast, describeDecision } from './live.js';

const CATS = ['typography', 'color', 'size', 'shape', 'spacing', 'alignment', 'icon', 'behavior', 'missing', 'extra'];

async function render() {
  const { base, comparisons } = await api('/api/comparisons');
  $('#intro').innerHTML = `Each comparison takes a screenshot of a design-project page and of the matching page on <a href="${esc(base)}/?skip=1" target="_blank">${esc(new URL(base).host)}</a> at the same width, and compares the two <b>images</b> the way a designer would: it finds the visual elements in each (text, icons, panels, dividers, pictures) from their pixels alone, pairs them by how they look and where they sit, and lists what differs: alignment across the page, size, color, type, corner radius, borders and spacing. No code or markup is read.`;
  $('#comps').innerHTML = comparisons.length ? comparisons.map(c => c.generated ? `
    <a class="card comp" href="compare.html?id=${encodeURIComponent(c.id)}">
      <div class="thumbs"><div class="d" style="background-image:url('/comparisons/${esc(c.id)}/design.jpg')"><span>Design</span></div><div class="l" style="background-image:url('/comparisons/${esc(c.id)}/live.jpg')"><span>Live</span></div></div>
      <div class="body">
        <h3>${esc(c.label)} <span class="chip">${c.theme === 'dark' ? '☾ Dark' : '☀ Light'}</span></h3>
        <div class="meta" title="${esc(c.design.page)} ↔ ${esc(c.live.path)}">${esc(c.design.page.replace(/\.dc\.html$/, ''))} ↔ <code>${esc(c.live.path)}</code> · ${new Date(c.generatedAt).toLocaleString()}</div>
        <div class="sev"><span><i class="dot high"></i><b>${c.stats.bySeverity.high}</b> high</span><span><i class="dot medium"></i><b>${c.stats.bySeverity.medium}</b> medium</span><span><i class="dot low"></i><b>${c.stats.bySeverity.low}</b> low</span><span class="faint">${c.stats.matched} matched elements</span></div>
        <div class="cats">${CATS.filter(k => c.stats.byCategory[k]).map(k => `<span class="chip">${k} ${c.stats.byCategory[k]}</span>`).join('')}</div>
        ${progressBar(c.progress)}${legend(c.progress)}
      </div>
    </a>` : `
    <div class="card comp"><div class="body"><h3>${esc(c.label)} <span class="chip">${c.theme === 'dark' ? '☾ Dark' : '☀ Light'}</span></h3><div class="meta">${esc(c.design.page)} ↔ <code>${esc(c.live.path)}</code></div><div class="howto" style="padding:0">Not run yet: <code>node tools/compare.mjs run ${esc(c.id)}</code></div></div></div>`).join('')
    : `<div class="card howto">No comparisons configured. Add one:<br><code>node tools/compare.mjs add home --design "ai magic" --live /</code><br><code>node tools/compare.mjs run home</code></div>`;
}
await render();
startLive();
onDecision((d, { mine }) => { render(); if (!mine) liveToast(describeDecision(d)); });

const pages = await api('/api/pages');
$('#pagesCount').textContent = `(${pages.length})`;
$('#pages').innerHTML = pages.map(p => `
  <div class="page">
    <div class="name">${esc(p.file.replace(/\.dc\.html$|\.html$/, ''))}${p.dc ? '' : ' <span class="chip">export</span>'}</div>
    <div class="props">${p.props ? Object.entries(p.props).filter(([, v]) => v.options || v.editor === 'boolean').map(([k, v]) => `<span class="chip" title="${esc((v.options || ['true', 'false']).join(' | '))}">${esc(k)}</span>`).join('') : ''}</div>
    <a class="btn small" href="view.html?page=${encodeURIComponent(p.file)}">View</a>
  </div>`).join('');
</script>
</body>
</html>
