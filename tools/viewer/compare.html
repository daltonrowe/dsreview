<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design vs Live</title>
<link rel="stylesheet" href="app.css">
<style>
  :root { --guide: #12b84a; }
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  .topbar { position: static; }
  .topbar select { padding: 4px 8px; }
  .topbar .links { display: flex; gap: 6px; }
  .topbar .prog { display: flex; flex-direction: column; gap: 4px; min-width: 220px; }
  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 20px; border-bottom: 1px solid var(--line); background: var(--panel); font-size: 12.5px; }
  .toolbar input[type=search] { width: 180px; padding: 4px 8px; }
  .toolbar label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  .cats button .n { color: var(--faint); font-weight: 400; margin-left: 3px; }
  .main { flex: 1; min-height: 0; display: grid; grid-template-columns: 470px 1fr; }
  @media (max-width: 1000px) { .main { grid-template-columns: 1fr; grid-template-rows: 45% 55%; } }

  /* findings list */
  #list { overflow-y: auto; border-right: 1px solid var(--line); background: var(--bg); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .f { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; scroll-margin: 10px; }
  .f:hover { border-color: var(--line-2); }
  .f.sel { border-color: var(--focus); box-shadow: 0 0 0 1px var(--focus); }
  .f.decided:not(.sel) { opacity: .62; }
  .fh { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .fh .cat { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; flex: none; }
  .fh .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .fh .sec { flex: none; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11.5px; color: var(--faint); }
  .why { font-size: 12.5px; line-height: 1.45; color: var(--text); }
  .why.auto { color: var(--muted); }
  .verdict { display: inline-block; font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; padding: 0 6px; border-radius: 999px; margin-right: 4px; vertical-align: 1px; }
  .verdict.real { background: var(--keep-bg); color: var(--keep); } .verdict.noise { background: var(--ignore-bg); color: var(--ignore); } .verdict.unsure { background: var(--panel-2); color: var(--muted); }
  .crops { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .crop { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .crop .lab { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .crop.d .lab { color: var(--design); } .crop.l .lab { color: var(--live); }
  .crop .lab em { font-style: normal; font-weight: 400; color: var(--faint); text-transform: none; letter-spacing: 0; }
  .crop .img { position: relative; background-repeat: no-repeat; border-radius: 6px; border: 1px solid var(--line); background-color: var(--panel-2); max-width: 100%; }
  .crop .img i { position: absolute; border: 1.5px solid; border-radius: 2px; pointer-events: none; }
  .crop.d .img i { border-color: var(--design); } .crop.l .img i { border-color: var(--live); }
  .crop .img { overflow: hidden; }
  .guide { position: absolute; pointer-events: none; background: var(--guide); box-shadow: 0 0 0 .5px rgba(255,255,255,.7); z-index: 4; }
  .guide.h { left: 0; right: 0; height: 1.5px; margin-top: -.75px; }
  .guide.v { top: 0; bottom: 0; width: 1.5px; margin-left: -.75px; }
  .crop .none { font-size: 12px; color: var(--faint); padding: 18px 0; text-align: center; border: 1px dashed var(--line-2); border-radius: 6px; }
  table.props { border-collapse: collapse; font-size: 12px; width: 100%; table-layout: fixed; }
  table.props td { padding: 2px 4px; vertical-align: top; overflow-wrap: anywhere; }
  table.props td:first-child { color: var(--muted); width: 30%; padding-left: 0; }
  table.props td.dv { color: var(--design); } table.props td.lv { color: var(--live); }
  table.props td.dv span, table.props td.lv span { color: var(--text); }
  table.props tr.head td { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  .fa { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .fa .spacer { flex: 1; }
  .fa a { font-size: 12px; color: var(--muted); }
  .note { width: 100%; min-height: 50px; font: inherit; font-size: 12.5px; padding: 6px 8px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--panel); color: var(--text); resize: vertical; }
  .notetext { font-size: 12.5px; color: var(--muted); white-space: pre-wrap; }
  .notetext::before { content: '✎ '; }

  /* meta-findings */
  .g { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--line-2); border-radius: var(--radius); padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; scroll-margin: 10px; }
  .g.high { border-left-color: var(--high); } .g.medium { border-left-color: var(--medium); } .g.low { border-left-color: var(--low); }
  .g:hover { border-color: var(--line-2); }
  .g.sel { border-color: var(--focus); box-shadow: 0 0 0 1px var(--focus); }
  .g.decided:not(.sel) { opacity: .62; }
  .g .gh { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .g .gh .meta { font-size: 11.5px; color: var(--faint); display: flex; gap: 6px; flex-wrap: wrap; align-items: baseline; }
  .g .gh .kind { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
  .g .gh .title { font-weight: 650; font-size: 14px; line-height: 1.35; }
  .hint-tag { display: inline-block; font-size: 10.5px; font-weight: 600; color: var(--muted); background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 0 6px; }
  .g .summary { font-size: 13px; color: var(--text); line-height: 1.45; }
  /* long text: two lines, click to expand */
  .clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .clamp.open { display: block; -webkit-line-clamp: unset; }
  .clamp:not(.open):hover { color: var(--muted); }
  .g .mixed { font-size: 11.5px; color: var(--muted); }
  .g .members { display: flex; flex-direction: column; gap: 2px; border-top: 1px solid var(--line); padding-top: 6px; }
  .g .members button.toggle { align-self: flex-start; border: 0; background: none; color: var(--muted); font-size: 12px; cursor: pointer; padding: 0; }
  .g .m { display: grid; grid-template-columns: 10px 76px 1fr auto; gap: 2px 6px; align-items: baseline; font-size: 12px; padding: 4px; border-radius: 5px; cursor: pointer; }
  .g .m .x { grid-column: 3 / 5; color: var(--muted); font-size: 12px; line-height: 1.4; }
  .g .m:hover { background: var(--panel-2); }
  .g .m.sel { background: color-mix(in srgb, var(--focus) 14%, transparent); }
  .g .m .c { color: var(--muted); text-transform: uppercase; font-size: 10.5px; letter-spacing: .04em; }
  .g .m .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .g .m .d { color: var(--faint); font-size: 11px; }
  .listhead { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin: 8px 2px 0; }

  /* stage */
  #stage { overflow: hidden; position: relative; background: var(--panel-2); min-height: 0; }
  /* each pane is its own viewport, so zooming in keeps design and live side by side; they scroll together */
  .panes { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 16px; padding: 12px 16px 12px; height: 100%; }
  .pane { display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 0; }
  .view { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; }
  .view .canvas { margin-bottom: 40px; }
  #stage.panning, #stage.panning * { cursor: grab !important; }
  #stage.dragging, #stage.dragging * { cursor: grabbing !important; user-select: none; }
  .pane h4 { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; display: flex; gap: 8px; align-items: center; }
  .pane h4 a { font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 420px; }
  .pane.d h4 { color: var(--design); } .pane.l h4 { color: var(--live); } .pane.o h4 { color: var(--text); }
  .canvas { position: relative; background: #fff; box-shadow: 0 0 0 1px var(--line-2); isolation: isolate; overflow: hidden; }
  .canvas img { position: absolute; left: 0; top: 0; width: 100%; display: block; user-select: none; -webkit-user-drag: none; }
  .canvas img.over { z-index: 1; }
  .canvas.difference img.over { mix-blend-mode: difference; }
  .boxes { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  .boxes b { position: absolute; border: 1px solid; border-radius: 2px; pointer-events: auto; cursor: pointer; }
  .boxes b.d { border-color: color-mix(in srgb, var(--design) 55%, transparent); }
  .boxes b.l { border-color: color-mix(in srgb, var(--live) 55%, transparent); }
  .boxes b:hover { background: color-mix(in srgb, currentColor 8%, transparent); border-width: 2px; }
  .boxes b.sel { border-width: 2.5px; z-index: 3; }
  .boxes b.sel.d { border-color: var(--design); background: color-mix(in srgb, var(--design) 10%, transparent); }
  .boxes b.sel.l { border-color: var(--live); background: color-mix(in srgb, var(--live) 10%, transparent); }
  .elems { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  .elems i { position: absolute; border: 1px solid; opacity: .75; }
  .elems i.text { border-color: #e11d48; } .elems i.icon { border-color: #7c3aed; } .elems i.panel { border-color: #0891b2; border-width: 2px; }
  .elems i.image { border-color: #ca8a04; border-style: dashed; } .elems i.line { border-color: #16a34a; } .elems i.shape { border-color: #64748b; }
  .elems i.unmatched { box-shadow: inset 0 0 0 999px rgba(225, 29, 72, .12); }
  .boxes b.rel { border-style: dashed; border-width: 2px; pointer-events: none; }
  .boxes b.rel.d { border-color: var(--design); } .boxes b.rel.l { border-color: var(--live); }
  .boxes b.sel.member::after { content: none; }
  .boxes b.sel::after { content: attr(data-lab); position: absolute; left: -2px; bottom: 100%; margin-bottom: 3px; font: 600 10.5px/1.4 var(--sans); color: #fff; padding: 0 5px; border-radius: 4px; white-space: nowrap; }
  .boxes b.sel.d::after { background: var(--design); } .boxes b.sel.l::after { background: var(--live); top: 100%; bottom: auto; margin: 3px 0 0; }
  /* Find: a big bouncing arrow pointing at the selected difference */
  .find-arrow { position: absolute; z-index: 5; pointer-events: none; width: 64px; height: 84px; margin-left: -32px; filter: drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1.5px #fff) drop-shadow(0 3px 6px rgba(0,0,0,.35)); animation: find-bounce .55s ease-in-out 5 alternate; }
  .find-arrow.d { color: var(--design); } .find-arrow.l { color: var(--live); }
  .find-arrow.up { transform: rotate(180deg); }
  .find-arrow svg { width: 100%; height: 100%; display: block; }
  @keyframes find-bounce { from { translate: 0 -14px; } to { translate: 0 0; } }
  @media (prefers-reduced-motion: reduce) { .find-arrow { animation: none; } }
  .swipe-line { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--live); z-index: 2; pointer-events: none; box-shadow: 0 0 0 1px rgba(255,255,255,.6); }
  #mix { width: 120px; }
  #stage.zoom-in, #stage.zoom-in * { cursor: zoom-in !important; }
  #stage.zoom-out, #stage.zoom-out * { cursor: zoom-out !important; }
  #theme button:disabled { opacity: .4; }
  .hint { font-size: 11.5px; color: var(--faint); }
  .empty { padding: 40px 20px; }
</style>
</head>
<body>
<div class="topbar">
  <a class="crumb" href="./">← Comparisons</a>
  <select id="pick" title="Comparison"></select>
  <div class="seg" id="theme" title="Light / dark version of this comparison"></div>
  <div class="links" id="links"></div>
  <span class="spacer"></span>
  <div class="prog" id="prog"></div>
  <a class="btn" id="export" download title="This comparison as Markdown (JSON: same URL with .json)">Export</a>
</div>
<div class="toolbar">
  <div class="seg" id="view" title="Groups: meta-findings Claude made by judgement, one decision each"></div>
  <div class="seg cats" id="cats"></div>
  <div class="seg" id="sev" title="Minimum severity"></div>
  <div class="seg" id="status"></div>
  <input type="search" id="q" placeholder="Search text, property… ( / )">
  <select id="bulk" title="Decide every finding currently shown"><option value="">Set all shown…</option></select>
  <span class="spacer" style="flex:1"></span>
  <div class="seg" id="mode" title="m cycles"></div>
  <label id="mixLab" hidden><span id="mixName">Live</span> <input type="range" id="mix" min="0" max="100" value="50"></label>
  <div class="seg" id="zoom"></div>
  <label title="Outline every element found in each screenshot, by kind (e)"><input type="checkbox" id="elems"> Elements</label>
  <span class="hint" id="boxHint"></span>
</div>
<div class="main">
  <aside id="list"></aside>
  <section id="stage"></section>
</div>
<script type="module">
import { api, esc, $, $$, swatch, viewUrl, config, editorUrl, DECISIONS, LABELS, TITLES, progressBar, legend } from './common.js';
import { startLive, onDecision, liveToast, describeDecision } from './live.js';

const CATS = ['typography', 'color', 'size', 'shape', 'spacing', 'alignment', 'icon', 'behavior', 'missing', 'extra'];
const SEVS = { high: 3, medium: 2, low: 1 };
const MODES = [['side', 'Side by side'], ['overlay', 'Overlay'], ['difference', 'Difference'], ['swipe', 'Swipe']];
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem('cmp-' + k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem('cmp-' + k, JSON.stringify(v)); } catch { } } };

const params = new URLSearchParams(location.search);
const st = {
  id: params.get('id'), report: null, decisions: {},
  cats: new Set(), minSev: store.get('minSev', 1), status: store.get('status', 'all'), q: '',
  mode: store.get('mode', 'side'), mix: 50, zoom: Number(store.get('zoomLevel', 1)) || 1,
  sel: params.get('f'), noteOpen: null, find: null, view: store.get('view', 'groups'), open: new Set(), expanded: new Set(),
};

// ---------- data ----------
const { comparisons } = await api('/api/comparisons');
const { root } = await config();
const ready = comparisons.filter(c => c.generated);
if (!st.id || !ready.some(c => c.id === st.id)) st.id = ready[0]?.id;
$('#pick').innerHTML = comparisons.map(c => `<option value="${esc(c.id)}" ${c.generated ? '' : 'disabled'} ${c.id === st.id ? 'selected' : ''}>${esc(c.label)}${c.theme === 'dark' ? ' · dark' : ''}${c.generated ? '' : ' (not run)'}</option>`).join('');
{
  // light/dark versions of the same pair
  const cur = comparisons.find(c => c.id === st.id);
  const sibs = comparisons.filter(c => cur && c.baseId === cur.baseId);
  $('#theme').innerHTML = ['light', 'dark'].map(t => { const c = sibs.find(x => x.theme === t); return `<button data-id="${esc(c?.id || '')}" aria-pressed="${cur?.theme === t}" ${c?.generated ? '' : `disabled title="${c ? `Not run: node tools/compare.mjs run ${esc(c.id)}` : 'This page has no dark theme'}"`}>${t === 'light' ? '☀ Light' : '☾ Dark'}</button>`; }).join('');
  $('#theme').onclick = e => { const b = e.target.closest('button'); if (b && !b.disabled && b.dataset.id !== st.id) { const u = new URL(location.href); u.searchParams.set('id', b.dataset.id); u.searchParams.delete('f'); location.href = u; } };
}
$('#pick').onchange = e => { location.search = `?id=${encodeURIComponent(e.target.value)}`; };
if (!st.id) { $('#list').innerHTML = `<div class="empty">No comparison has been run. <code>node tools/compare.mjs run</code></div>`; throw new Error('nothing to show'); }

async function load() {
  const r = await api(`/api/comparisons/${encodeURIComponent(st.id)}`);
  st.report = r; st.decisions = r.decisions || {}; st._byId = null;
  document.title = `${r.label} · Design vs Live`;
  $('#export').href = `/api/comparisons/${encodeURIComponent(st.id)}/export.md`;
  $('#links').innerHTML = `<a class="btn small" href="${esc(r.design.view)}" target="_blank" title="${esc(r.design.page)} ${esc(JSON.stringify({ props: r.design.props, state: r.design.state }))}">Design page ↗</a><a class="btn small" href="${esc(r.live.url)}" target="_blank" title="${esc(r.live.url)}">Live page ↗</a><span class="hint" title="Re-run: node tools/compare.mjs run ${esc(r.id)}">captured ${esc(new Date(r.generatedAt).toLocaleString())}</span>`;
}
await load();

const decisionOf = f => st.decisions[f.id]?.decision || null;
function progress() {
  const p = { ...Object.fromEntries(DECISIONS.map(d => [d, 0])), undecided: 0, total: 0 };
  for (const f of st.report.findings) { p.total++; p[decisionOf(f) || 'undecided']++; }
  return p;
}
function visible() {
  const q = st.q.toLowerCase();
  return st.report.findings.filter(f => {
    if (st.cats.size && !st.cats.has(f.category)) return false;
    if (SEVS[f.severity] < st.minSev) return false;
    const d = decisionOf(f);
    if (st.status === 'todo' && d) return false;
    if (st.status === 'done' && !d) return false;
    if (st.status !== 'all' && st.status !== 'todo' && st.status !== 'done' && d !== st.status) return false;
    if (q && !`${f.text} ${f.section || ''} ${f.category} ${f.props.map(p => `${p.prop} ${p.design} ${p.live}`).join(' ')} ${st.decisions[f.id]?.note || ''} ${f.review?.explanation || ''} ${f.review?.verdict || ''}`.toLowerCase().includes(q)) return false;
    return true;
  });
}

// ---------- toolbar ----------
// ---------- meta-findings (groups) ----------
const byId = () => (st._byId ||= new Map(st.report.findings.map(f => [f.id, f])));
const groups = () => (st.report.groups?.groups || []).map(g => ({ ...g, members: g.findings.map(i => byId().get(i)).filter(Boolean) })).filter(g => g.members.length);
const groupOf = gid => groups().find(g => g.id === gid);
const isGroupSel = id => typeof id === 'string' && id.startsWith('g:');
// findings the current selection is about: a group's members, or one finding
function selFindings() {
  if (!st.sel) return [];
  if (isGroupSel(st.sel)) return groupOf(st.sel.slice(2))?.members || [];
  const f = byId().get(st.sel);
  return f ? [f] : [];
}
const groupDecision = g => { const ds = new Set(g.members.map(f => decisionOf(f) || '')); return ds.size === 1 ? [...ds][0] || null : 'mixed'; };
const union = boxes => { if (!boxes.length) return null; const x = Math.min(...boxes.map(b => b.x)), y = Math.min(...boxes.map(b => b.y)); return { x, y, w: Math.max(...boxes.map(b => b.x + b.w)) - x, h: Math.max(...boxes.map(b => b.y + b.h)) - y }; };
// what the list shows: in Groups view, groups with a visible member, then the visible ungrouped findings
function items() {
  const vis = visible(), visIds = new Set(vis.map(f => f.id));
  if (st.view !== 'groups' || !groups().length) return vis.map(f => ({ type: 'f', id: f.id, f }));
  const grouped = new Set(groups().flatMap(g => g.members.map(f => f.id)));
  const gs = groups().filter(g => g.members.some(f => visIds.has(f.id))).filter(g => {
    // the status filter applies to the group as a whole
    const d = groupDecision(g);
    if (st.status === 'todo') return d === null || d === 'mixed';
    if (st.status === 'done') return d && d !== 'mixed';
    if (st.status !== 'all') return d === st.status;
    return true;
  });
  return [...gs.map(g => ({ type: 'g', id: `g:${g.id}`, g })), ...vis.filter(f => !grouped.has(f.id)).map(f => ({ type: 'f', id: f.id, f }))];
}

function renderToolbar() {
  const all = st.report.findings;
  const ng = groups().length;
  $('#view').hidden = !ng;
  $('#view').innerHTML = [['groups', `Groups ${ng}`], ['findings', `Findings ${all.length}`]].map(([v, l]) => `<button data-v="${v}" aria-pressed="${st.view === v}">${l}</button>`).join('');
  $('#cats').innerHTML = CATS.filter(c => all.some(f => f.category === c)).map(c => `<button data-c="${c}" aria-pressed="${st.cats.has(c)}">${c}<span class="n">${all.filter(f => f.category === c).length}</span></button>`).join('');
  $('#sev').innerHTML = [[1, 'All'], [2, 'Medium+'], [3, 'High']].map(([v, l]) => `<button data-v="${v}" aria-pressed="${st.minSev === v}">${l}</button>`).join('');
  $('#status').innerHTML = [['all', 'All'], ['todo', 'To do'], ['done', 'Decided'], ...DECISIONS.map(d => [d, LABELS[d]])].map(([v, l]) => `<button data-v="${v}" class="${DECISIONS.includes(v) ? v : ''}" aria-pressed="${st.status === v}" title="${esc(TITLES[v] || '')}">${l}</button>`).join('');
  $('#mode').innerHTML = MODES.map(([v, l]) => `<button data-v="${v}" aria-pressed="${st.mode === v}">${l}</button>`).join('');
  renderZoom();
  $('#bulk').innerHTML = `<option value="">Set all shown…</option>${DECISIONS.map(d => `<option value="${d}">${LABELS[d]}</option>`).join('')}<option value="clear">Clear</option>`;
  $('#mixLab').hidden = st.mode === 'side';
  $('#mixName').textContent = st.mode === 'swipe' ? 'Swipe' : 'Live';
  const p = progress();
  $('#prog').innerHTML = progressBar(p) + legend(p);
}
$('#view').onclick = e => { const b = e.target.closest('button'); if (!b) return; st.view = b.dataset.v; store.set('view', st.view); refresh(); };
$('#cats').onclick = e => { const b = e.target.closest('button'); if (!b) return; const c = b.dataset.c; if (e.metaKey || e.ctrlKey || e.shiftKey) st.cats.has(c) ? st.cats.delete(c) : st.cats.add(c); else st.cats = st.cats.has(c) && st.cats.size === 1 ? new Set() : new Set([c]); refresh(); };

function setMode(m) { st.mode = m; store.set('mode', m); renderToolbar(); renderStage(); }

// ---------- findings list ----------
const CROP_W = 205, CROP_H = 130, PAD = 18;
// The part of a screenshot a finding is about. For an alignment with a partner (the masthead vs the
// first rail button), the window spans the meeting point of the two along the guide line.
function cropRegion(box, partner, guide) {
  if (!partner || !guide) return { x: box.x - PAD, y: box.y - PAD, w: Math.max(box.w + PAD * 2, 90), h: Math.max(box.h + PAD * 2, 40) };
  const lo = Math.min(...guide) - 50, hi = Math.max(...guide) + 50;
  if (guide.axis === 'y') {
    const [L, R] = box.x <= partner.x ? [box, partner] : [partner, box];
    const x0 = L.x + Math.max(0, L.w - 140) - PAD, x1 = R.x + Math.min(R.w, 140) + PAD;
    return { x: x0, y: lo, w: x1 - x0, h: hi - lo };
  }
  const [T, B] = box.y <= partner.y ? [box, partner] : [partner, box];
  const y0 = T.y + Math.max(0, T.h - 100) - PAD, y1 = B.y + Math.min(B.h, 100) + PAD;
  return { x: lo, y: y0, w: hi - lo, h: y1 - y0 };
}
function crop(side, f, shot, box, note) {
  const r = st.report, W = r[side === 'd' ? 'design' : 'live'].width, H = r[side === 'd' ? 'design' : 'live'].height;
  const partner = f.related?.[0]?.[side === 'd' ? 'design' : 'live'];
  const g = f.guide && Object.assign([...f.guide[side === 'd' ? 'design' : 'live']], { axis: f.guide.axis });
  const reg = cropRegion(box, partner, g);
  const rx = Math.max(0, reg.x), ry = Math.max(0, reg.y);
  const rw = Math.min(W - rx, reg.w), rh = Math.min(H - ry, reg.h);
  const s = Math.min(CROP_W / rw, CROP_H / rh, 2);
  const outline = (b, extra = '') => `<i style="left:${(b.x - rx) * s - 2}px;top:${(b.y - ry) * s - 2}px;width:${b.w * s + 4}px;height:${b.h * s + 4}px${extra}"></i>`;
  const lines = g ? g.map(v => g.axis === 'y' ? `<u class="guide h" style="top:${(v - ry) * s}px"></u>` : `<u class="guide v" style="left:${(v - rx) * s}px"></u>`).join('') : '';
  return `<div class="img" style="width:${rw * s}px;height:${rh * s}px;background-image:url('/comparisons/${esc(r.id)}/${shot}');background-size:${W * s}px auto;background-position:${-rx * s}px ${-ry * s}px">${outline(box, note ? ';border-style:dashed' : '')}${partner ? outline(partner, ';border-style:dashed;opacity:.8') : ''}${lines}</div>`;
}
function cardHtml(f) {
  const d = decisionOf(f), note = st.decisions[f.id]?.note;
  const dBox = f.design?.box || f.live.box, lBox = f.live?.box || f.design.box;
  const showText = f.liveText ? `<div class="hint">live text: “${esc(f.liveText)}”</div>` : '';
  return `<div class="f${f.id === st.sel ? ' sel' : ''}${d ? ' decided' : ''}" data-id="${esc(f.id)}">
    <div class="fh"><i class="dot ${f.severity}" title="${f.severity}"></i><span class="cat">${f.category}</span><span class="txt" title="${esc(f.text)}">${esc(f.text)}</span>${f.section ? `<span class="sec" title="${esc(f.section)}">${esc(f.section)}</span>` : ''}</div>
    ${explainHtml(f, 'why')}
    <div class="crops">
      <div class="crop d"><span class="lab">Design${f.design ? '' : ' <em>same spot</em>'}</span>${crop('d', f, 'design.jpg', dBox, !f.design)}</div>
      <div class="crop l"><span class="lab">Live${f.live ? '' : ' <em>same spot</em>'}</span>${crop('l', f, 'live.jpg', lBox, !f.live)}</div>
    </div>
    <table class="props"><tr class="head"><td></td><td class="dv">Design</td><td class="lv">Live</td></tr>${f.props.map(p => `<tr><td>${esc(p.prop)}</td><td class="dv"><span>${p.swatch || p.gradient ? swatch(p.design) : ''}${esc(p.design)}</span></td><td class="lv"><span>${p.swatch || p.gradient ? swatch(p.live) : ''}${esc(p.live)}</span></td></tr>`).join('')}</table>
    ${showText}
    <div class="fa"><div class="seg">${DECISIONS.map((x, i) => `<button class="${x}" data-d="${x}" aria-pressed="${d === x}" title="${esc(TITLES[x])} (${i + 1})">${LABELS[x]}</button>`).join('')}</div>
      <button class="btn small" data-act="find" title="Point at it on the screenshots (f)">➜ Find</button>
      <button class="btn small" data-act="note" title="Add a note (n)">✎</button>
      <a class="btn small" href="/api/comparisons/${encodeURIComponent(st.id)}/findings/${encodeURIComponent(f.id)}/download" download title="Download a zip: write-up (.md) and named screenshots" aria-label="Download">${DOWNLOAD_ICON}</a><span class="spacer"></span>
      ${f.design?.where ? `<a href="${esc(viewUrl({ ...st.report.design, width: st.report.design.width }, f.design.where))}" target="_blank" title="Open the design page with this element marked">design ↗</a>` : ''}
      ${f.design?.source ? `<a href="${esc(editorUrl(root, f.design.source.file, f.design.source.line, f.design.source.col))}" title="Open the source in VS Code">${esc(f.design.source.file.replace(/\.dc\.html$/, ''))}:${f.design.source.line}</a>` : ''}</div>
    ${st.noteOpen === f.id ? `<textarea class="note" placeholder="Note (saved when you leave the box)">${esc(note || '')}</textarea>` : note ? `<div class="notetext">${esc(note)}</div>` : ''}
  </div>`;
}
// What's off, in words, written by the review model (compare.mjs review). Two lines; click to read all.
const DOWNLOAD_ICON = '<svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M7.25 1.5h1.5v7.19l2.47-2.47 1.06 1.06L8 11.56 3.72 7.28l1.06-1.06 2.47 2.47zM2 13h12v1.5H2z"/></svg>';
function explainHtml(f, cls) {
  const text = f.review?.explanation;
  if (!text) return '';
  const k = `x:${f.id}`, open = st.expanded.has(k);
  const verdict = f.review?.verdict ? `<span class="verdict ${f.review.verdict}" title="${esc(`${f.review.model}, ${f.review.confidence} confidence`)}">${f.review.verdict === 'noise' ? 'Looks like noise' : f.review.verdict === 'real' ? 'Real' : 'Unsure'}</span> ` : '';
  return `<div class="${cls} clamp${open ? ' open' : ''}" data-x="${esc(k)}" title="Written by ${esc(f.review.model)}. Click to ${open ? 'collapse' : 'read all'}">${verdict}${esc(text)}</div>`;
}
function groupHtml(g) {
  const d = groupDecision(g), open = st.open.has(g.id);
  const dBoxes = g.members.filter(f => f.design).map(f => f.design.box), lBoxes = g.members.filter(f => f.live).map(f => f.live.box);
  const pseudo = { design: { box: union(dBoxes) || union(lBoxes) }, live: { box: union(lBoxes) || union(dBoxes) } };
  const sel = st.sel === `g:${g.id}`;
  const cats = [...new Set(g.members.map(f => f.category))];
  const shown = open ? g.members : g.members.slice(0, 4);
  return `<div class="g ${g.severity}${sel ? ' sel' : ''}${d && d !== 'mixed' ? ' decided' : ''}" data-g="${esc(g.id)}">
    <div class="gh"><div class="meta"><span class="kind">Group</span><span>${g.members.length} finding${g.members.length === 1 ? '' : 's'} · ${esc(cats.join(', '))}</span>${g.hint ? `<span class="hint-tag">${esc(g.hint)}</span>` : ''}</div><div class="title">${esc(g.title)}</div></div>
    ${g.summary ? `<div class="summary clamp${st.expanded.has(`g:${g.id}`) ? ' open' : ''}" data-x="g:${esc(g.id)}" title="Click to ${st.expanded.has(`g:${g.id}`) ? 'collapse' : 'read all'}">${esc(g.summary)}</div>` : ''}
    <div class="crops">
      <div class="crop d"><span class="lab">Design</span>${crop('d', pseudo, 'design.jpg', pseudo.design.box, !dBoxes.length)}</div>
      <div class="crop l"><span class="lab">Live</span>${crop('l', pseudo, 'live.jpg', pseudo.live.box, !lBoxes.length)}</div>
    </div>
    <div class="fa"><div class="seg">${DECISIONS.map((x, i) => `<button class="${x}" data-gd="${x}" aria-pressed="${d === x}" title="${esc(TITLES[x])} — all ${g.members.length} (${i + 1})">${LABELS[x]}</button>`).join('')}</div>
      ${d === 'mixed' ? '<span class="mixed">mixed decisions</span>' : ''}
      <button class="btn small" data-act="gfind" title="Point at it on the screenshots (f)">➜ Find</button>
      <a class="btn small" href="/api/comparisons/${encodeURIComponent(st.id)}/groups/${encodeURIComponent(g.id)}/download" download title="Download a zip: the group's write-up (.md), overview and every finding's screenshots" aria-label="Download group">${DOWNLOAD_ICON}</a></div>
    <div class="members">${shown.map(f => { const fd = decisionOf(f); return `<div class="m${st.sel === f.id ? ' sel' : ''}" data-id="${esc(f.id)}" title="${esc(f.props.map(p => `${p.prop}: ${p.design} → ${p.live}`).join('\n'))}"><i class="dot ${f.severity}"></i><span class="c">${f.category}</span><span class="t">${esc(f.text)} · ${esc(f.props[0] ? `${f.props[0].prop}: ${f.props[0].design} → ${f.props[0].live}` : '')}</span><span class="d">${fd ? LABELS[fd] : ''}</span>${explainHtml(f, 'x')}</div>`; }).join('')}
      ${g.members.length > 4 ? `<button class="toggle" data-act="gopen">${open ? 'Show fewer' : `Show all ${g.members.length}`}</button>` : ''}</div>
  </div>`;
}
function renderList() {
  const list = items();
  const firstUngrouped = list.findIndex(it => it.type === 'f');
  const html = list.map((it, i) => (i === firstUngrouped && st.view === 'groups' && groups().length ? `<div class="listhead">Not in a group</div>` : '') + (it.type === 'g' ? groupHtml(it.g) : cardHtml(it.f)));
  $('#list').innerHTML = list.length ? html.join('') : `<div class="empty">Nothing matches these filters.</div>`;
  if (st.noteOpen) $(`.f[data-id="${CSS.escape(st.noteOpen)}"] textarea`)?.focus();
}
function renderCard(id) {
  const f = st.report.findings.find(x => x.id === id), el = $(`.f[data-id="${CSS.escape(id)}"]`);
  if (f && el) el.outerHTML = cardHtml(f);
}
$('#list').addEventListener('click', e => {
  const cl = e.target.closest('.clamp');
  if (cl) {
    const k = cl.dataset.x;
    st.expanded.has(k) ? st.expanded.delete(k) : st.expanded.add(k);
    cl.classList.toggle('open', st.expanded.has(k));
    cl.title = `Click to ${st.expanded.has(k) ? 'collapse' : 'read all'}`;
    return;
  }
  const gc = e.target.closest('.g');
  if (gc) {
    const g = groupOf(gc.dataset.g);
    const gb = e.target.closest('button[data-gd]');
    if (gb) { decide(g.members.map(f => f.id), groupDecision(g) === gb.dataset.gd ? null : gb.dataset.gd, `g:${g.id}`); return; }
    if (e.target.closest('[data-act=gopen]')) { st.open.has(g.id) ? st.open.delete(g.id) : st.open.add(g.id); renderList(); return; }
    if (e.target.closest('[data-act=gfind]')) { find(`g:${g.id}`); return; }
    const m = e.target.closest('.m');
    if (m) { select(m.dataset.id, { scrollList: false }); return; }
    select(`g:${g.id}`, { scrollList: false });
    return;
  }
  const card = e.target.closest('.f'); if (!card) return;
  const id = card.dataset.id;
  const b = e.target.closest('button[data-d]');
  if (b) { const f = st.report.findings.find(x => x.id === id); decide([id], decisionOf(f) === b.dataset.d ? null : b.dataset.d); return; }
  if (e.target.closest('[data-act=find]')) { find(id); return; }
  if (e.target.closest('[data-act=note]')) { st.noteOpen = st.noteOpen === id ? null : id; renderCard(id); $(`.f[data-id="${CSS.escape(id)}"] textarea`)?.focus(); return; }
  if (e.target.closest('a, textarea')) return;
  select(id, { scrollList: false });
});
$('#list').addEventListener('focusout', async e => {
  if (!e.target.matches('textarea.note')) return;
  const id = e.target.closest('.f').dataset.id, text = e.target.value.trim();
  st.noteOpen = null;
  if (text !== (st.decisions[id]?.note || '')) await save([id], { note: text });
  renderCard(id);
});

async function save(ids, body) {
  const res = await api(`/api/comparisons/${encodeURIComponent(st.id)}/decisions`, { method: 'PUT', body: { ids, ...body } });
  for (const [id, v] of Object.entries(res)) { if (v) st.decisions[id] = v; else delete st.decisions[id]; }
}
// item: the list item being decided (a finding id or "g:<group>"), so selection moves on from it
async function decide(ids, decision, item = ids.length === 1 ? ids[0] : null) {
  const before = items().map(it => it.id);
  await save(ids, { decision });
  // keep moving: after deciding the selected item, select the next one
  if (item && item === st.sel && decision) {
    const i = before.indexOf(st.sel); const after = items().map(it => it.id);
    st.sel = after.find(id => before.indexOf(id) > i) || after.find(id => id !== item) || null;
  }
  refresh();
  if (st.sel) select(st.sel);
}

// ---------- stage ----------
let scale = 1;
// Zoom: st.zoom multiplies the fitted scale (1 = both screenshots fit the stage).
const ZSTEP = 1.6, ZMIN = 0.5, ZMAX = 12;
function fitScale() {
  const nPanes = st.mode === 'side' ? 2 : 1, r = st.report, avail = $('#stage').clientWidth - 32 - (nPanes - 1) * 16 - 16;
  return Math.min(1, avail / nPanes / Math.max(r.design.width, r.live.width));
}
// The views (one per pane). Scroll positions are kept equal, so both show the same part of the page.
const views = () => $$('.view');
let syncing = false;
function syncFrom(v) {
  if (syncing) return;
  syncing = true;
  for (const o of views()) if (o !== v) { o.scrollLeft = v.scrollLeft; o.scrollTop = v.scrollTop; }
  syncing = false;
}
function scrollViews(left, top, smooth) {
  for (const v of views()) v.scrollTo({ left: Math.max(0, left), top: Math.max(0, top), behavior: smooth ? 'smooth' : 'instant' });
}
function stageScale() { return fitScale() * st.zoom; }
function renderZoom() {
  const pct = Math.round(stageScale() * 100);
  $('#zoom').innerHTML = `<button data-v="out" title="Zoom out (⌘/Ctrl + Z + click)">−</button><button data-v="fit" title="Fit (current zoom ${pct}%)" aria-pressed="${st.zoom === 1}">${st.zoom === 1 ? 'Fit' : pct + '%'}</button><button data-v="in" title="Zoom in (hold Z + click)">+</button><button data-v="real" title="Actual pixels">1:1</button>`;
}
function setZoom(z) { st.zoom = Math.max(ZMIN, Math.min(ZMAX, z)); store.set('zoomLevel', st.zoom); renderZoom(); renderStage(); }
// Zoom by `factor`, keeping the screenshot point under (clientX, clientY) where it is.
// Each view zooms around the same page point, so design and live stay comparable side by side.
function zoomAt(factor, clientX, clientY) {
  // the view under the pointer (else the first) gives the page point and where it sits on screen
  const v = views().find(x => { const r = x.getBoundingClientRect(); return clientX >= r.left && clientX <= r.right && clientY >= r.top && clientY <= r.bottom; }) || views()[0];
  if (!v) return;
  const r = v.getBoundingClientRect(), before = scale;
  const sx = clientX - r.left, sy = clientY - r.top;
  const px = (v.scrollLeft + sx) / before, py = (v.scrollTop + sy) / before;
  setZoom(st.zoom * factor);
  scrollViews(px * scale - sx, py * scale - sy);
}
function renderStage() {
  const keep = views()[0] && { left: views()[0].scrollLeft / scale, top: views()[0].scrollTop / scale };
  const r = st.report, base = `/comparisons/${encodeURIComponent(r.id)}/`;
  const side = st.mode === 'side';
  scale = stageScale();
  const canvas = (cls, w, h, imgs) => `<div class="canvas ${cls}" style="width:${w * scale}px;height:${h * scale}px">${imgs}<div class="boxes"></div></div>`;
  if (side) {
    $('#stage').innerHTML = `<div class="panes">
      <div class="pane d"><h4>Design <a href="${esc(r.design.view)}" target="_blank">${esc(r.design.page)}</a></h4><div class="view">${canvas('dc', r.design.width, r.design.height, `<img src="${base}design.jpg" alt="design">`)}</div></div>
      <div class="pane l"><h4>Live <a href="${esc(r.live.url)}" target="_blank">${esc(r.live.path)}</a></h4><div class="view">${canvas('lc', r.live.width, r.live.height, `<img src="${base}live.jpg" alt="live">`)}</div></div>
    </div>`;
  } else {
    const h = Math.max(r.design.height, r.live.height);
    $('#stage').innerHTML = `<div class="panes"><div class="pane o"><h4><span style="color:var(--design)">Design</span> + <span style="color:var(--live)">Live</span> <span class="hint">${st.mode === 'difference' ? 'identical pixels are black' : st.mode === 'swipe' ? 'live to the right of the line' : 'slider sets live opacity'}</span></h4><div class="view">${canvas(`oc ${st.mode}`, Math.max(r.design.width, r.live.width), h, `<img src="${base}design.jpg" alt="design"><img class="over" src="${base}live.jpg" alt="live">${st.mode === 'swipe' ? '<div class="swipe-line"></div>' : ''}`)}</div></div></div>`;
    $('#mix').value = st.mix;
    applyMix();
  }
  for (const v of views()) v.addEventListener('scroll', () => syncFrom(v), { passive: true });
  if (keep) scrollViews(keep.left * scale, keep.top * scale);
  drawBoxes();
  drawElems();
}
function applyMix() {
  const over = $('.canvas img.over'); if (!over) return;
  over.style.opacity = st.mode === 'overlay' ? st.mix / 100 : 1;
  over.style.clipPath = st.mode === 'swipe' ? `inset(0 0 0 ${st.mix}%)` : 'none';
  const line = $('.swipe-line'); if (line) line.style.left = `${st.mix}%`;
}
function boxEl(f, side, box) {
  const lab = `${f.category}: ${f.text}`.slice(0, 60);
  const on = f.id === st.sel || (isGroupSel(st.sel) && selFindings().includes(f));
  return `<b class="${side}${on ? ' sel' : ''}${on && isGroupSel(st.sel) ? ' member' : ''}" data-id="${esc(f.id)}" data-lab="${esc(lab)}" title="${esc(lab)}" style="left:${box.x * scale - 2}px;top:${box.y * scale - 2}px;width:${Math.max(box.w * scale, 2) + 4}px;height:${Math.max(box.h * scale, 2) + 4}px"></b>`;
}
function drawBoxes() {
  // a selected finding is shown alone; with nothing selected (Esc), every finding shown is outlined to pick from
  const sel = selFindings();
  const list = sel.length ? sel : visible();
  $('#boxHint').textContent = sel.length ? 'Esc shows every box' : 'Click a box to select its finding';
  if (st.mode === 'side') {
    $('.canvas.dc .boxes').innerHTML = list.filter(f => f.design).map(f => boxEl(f, 'd', f.design.box)).join('');
    $('.canvas.lc .boxes').innerHTML = list.filter(f => f.live).map(f => boxEl(f, 'l', f.live.box)).join('');
  } else {
    $('.canvas.oc .boxes').innerHTML = list.map(f => (f.design ? boxEl(f, 'd', f.design.box) : '') + (f.live ? boxEl(f, 'l', f.live.box) : '')).join('');
  }
  drawGuides();
  drawArrows();
}

// Alignment findings: guide lines across the whole screenshot at the edge that should line up
// (design: one line; live: one per element, showing the gap), and the partner boxes dashed.
// Every element the vision found in each screenshot (from snapshot.json; not on the deployed site).
let elems = null, showElems = false;
async function drawElems() {
  for (const x of $$('.elems')) x.parentNode.removeChild(x);
  if (!showElems) return;
  if (!elems) { try { elems = await (await fetch(`/comparisons/${encodeURIComponent(st.id)}/snapshot.json`)).json(); } catch { elems = { design: { blobs: [] }, live: { blobs: [] } }; } }
  const matched = { d: new Set(st.report.pairs.map(p => p.design)), l: new Set(st.report.pairs.map(p => p.live)) };
  const layer = (side, blobs) => `<div class="elems">${blobs.map(b => `<i class="${b.kind}${matched[side].has(b.id) ? '' : ' unmatched'}" title="${b.kind} ${b.box.w}×${b.box.h}${matched[side].has(b.id) ? '' : ' (unmatched)'}" style="left:${b.box.x * scale}px;top:${b.box.y * scale}px;width:${b.box.w * scale}px;height:${b.box.h * scale}px"></i>`).join('')}</div>`;
  if (st.mode === 'side') { $('.canvas.dc')?.insertAdjacentHTML('beforeend', layer('d', elems.design.blobs)); $('.canvas.lc')?.insertAdjacentHTML('beforeend', layer('l', elems.live.blobs)); }
  else $('.canvas.oc')?.insertAdjacentHTML('beforeend', layer('d', elems.design.blobs) + layer('l', elems.live.blobs));
}
$('#elems').onchange = e => { showElems = e.target.checked; drawElems(); };

function drawGuides() {
  $$('.canvas .guide, .boxes b.rel').forEach(x => x.remove());
  const f = !isGroupSel(st.sel) && st.sel && byId().get(st.sel);
  if (!f) return;
  const rel = (sel, side, key) => { const layer = $(sel); if (!layer) return; for (const r of f.related || []) if (r[key]) layer.insertAdjacentHTML('beforeend', `<b class="rel ${side}" title="${esc(r.text || '')}" style="left:${r[key].x * scale - 2}px;top:${r[key].y * scale - 2}px;width:${r[key].w * scale + 4}px;height:${r[key].h * scale + 4}px"></b>`); };
  const lines = (sel, vals) => { const c = $(sel); if (!c || !f.guide) return; for (const v of vals) c.insertAdjacentHTML('beforeend', f.guide.axis === 'y' ? `<u class="guide h" style="top:${v * scale}px"></u>` : `<u class="guide v" style="left:${v * scale}px"></u>`); };
  if (st.mode === 'side') {
    rel('.canvas.dc .boxes', 'd', 'design'); rel('.canvas.lc .boxes', 'l', 'live');
    if (f.guide) { lines('.canvas.dc', f.guide.design); lines('.canvas.lc', f.guide.live); }
  } else {
    rel('.canvas.oc .boxes', 'd', 'design'); rel('.canvas.oc .boxes', 'l', 'live');
    if (f.guide) lines('.canvas.oc', [...f.guide.design, ...f.guide.live]);
  }
}

// ---------- find: a big arrow on the selected difference ----------
const ARROW = `<svg viewBox="0 0 64 84" aria-hidden="true"><path fill="currentColor" d="M22 0h20v46h18L32 84 4 46h18z"/></svg>`;
function arrowEl(side, box) {
  const ah = 84, gap = 6, cx = (box.x + box.w / 2) * scale, top = box.y * scale;
  // not enough room above (top of the page): point up from below instead
  const up = top < ah + gap;
  const y = up ? (box.y + box.h) * scale + gap : top - ah - gap;
  return `<div class="find-arrow ${side}${up ? ' up' : ''}" style="left:${cx}px;top:${y}px">${ARROW}</div>`;
}
function drawArrows() {
  $$('.find-arrow').forEach(a => a.remove());
  if (!st.find || st.find !== st.sel) return;
  const fs = selFindings();
  const f = fs.length === 1 ? fs[0] : { design: { box: union(fs.filter(x => x.design).map(x => x.design.box)) }, live: { box: union(fs.filter(x => x.live).map(x => x.live.box)) } };
  if (!f.design?.box && !f.live?.box) return;
  const put = (sel, side, box) => { const layer = $(sel); if (layer && box) layer.insertAdjacentHTML('beforeend', arrowEl(side, box)); };
  if (st.mode === 'side') { put('.canvas.dc .boxes', 'd', f.design?.box); put('.canvas.lc .boxes', 'l', f.live?.box); }
  else { put('.canvas.oc .boxes', 'd', f.design?.box); put('.canvas.oc .boxes', 'l', f.live?.box); }
}
function find(id) {
  st.find = id;
  select(id, { scrollList: false });
}
$('#stage').addEventListener('click', e => {
  // hold Z and click to zoom in there; ⌘/Ctrl + Z + click zooms out
  if (zHeld) { e.preventDefault(); e.stopPropagation(); zoomAt(e.metaKey || e.ctrlKey ? 1 / ZSTEP : ZSTEP, e.clientX, e.clientY); return; }
  const b = e.target.closest('.boxes b'); if (b) select(b.dataset.id, { scrollStage: false });
}, true);
let zHeld = false, shiftHeld = false, drag = null;
// Hold Shift and drag to pan (both views move together)
function panCursor() { $('#stage').classList.toggle('panning', shiftHeld && !drag); $('#stage').classList.toggle('dragging', !!drag); }
$('#stage').addEventListener('mousedown', e => {
  if (!e.shiftKey || e.button !== 0) return;
  const v = views()[0]; if (!v) return;
  e.preventDefault();
  drag = { x: e.clientX, y: e.clientY, left: v.scrollLeft, top: v.scrollTop, moved: false };
  panCursor();
});
addEventListener('mousemove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 2) drag.moved = true;
  scrollViews(drag.left - dx, drag.top - dy);
});
addEventListener('mouseup', () => { if (!drag) return; const moved = drag.moved; drag = null; panCursor(); if (moved) { const stop = ev => { ev.stopPropagation(); ev.preventDefault(); }; $('#stage').addEventListener('click', stop, { capture: true, once: true }); } });
addEventListener('keydown', e => { if (e.key === 'Shift' && !e.target.matches?.('input, textarea, select')) { shiftHeld = true; panCursor(); } });
addEventListener('keyup', e => { if (e.key === 'Shift') { shiftHeld = false; panCursor(); } });
addEventListener('blur', () => { shiftHeld = false; drag = null; panCursor(); });
function zoomCursor(e) { $('#stage').classList.toggle('zoom-in', zHeld && !(e?.metaKey || e?.ctrlKey)); $('#stage').classList.toggle('zoom-out', zHeld && !!(e?.metaKey || e?.ctrlKey)); }
addEventListener('keydown', e => {
  if (e.target.matches?.('input, textarea, select')) return;
  if (e.key === 'z' || e.key === 'Z') { zHeld = true; if (e.metaKey || e.ctrlKey) e.preventDefault(); }
  zoomCursor(e);
}, true);
addEventListener('keyup', e => {
  // macOS swallows the Z keyup while ⌘ is down, so letting go of ⌘ ends it too
  if (e.key === 'z' || e.key === 'Z' || e.key === 'Meta') zHeld = false;
  zoomCursor(e);
});
addEventListener('blur', () => { zHeld = false; zoomCursor(); });
addEventListener('resize', () => renderStage());

function select(id, { scrollList = true, scrollStage = true } = {}) {
  if (id !== st.find) st.find = null;
  st.sel = id;
  const u = new URL(location.href); if (id) u.searchParams.set('f', id); else u.searchParams.delete('f'); history.replaceState(null, '', u);
  $$('.f.sel, .g.sel, .g .m.sel').forEach(el => el.classList.remove('sel'));
  const card = id && (isGroupSel(id) ? $(`.g[data-g="${CSS.escape(id.slice(2))}"]`) : $(`.f[data-id="${CSS.escape(id)}"]`) || $(`.g .m[data-id="${CSS.escape(id)}"]`));
  card?.classList.add('sel');
  if (card && scrollList) card.scrollIntoView({ block: 'nearest' });
  drawBoxes();
  if (selFindings().length && scrollStage) {
    const b = $(`.boxes b.sel`);
    if (b) {
      const v = b.closest('.view'), vr = v.getBoundingClientRect(), br = b.getBoundingClientRect();
      const top = v.scrollTop + br.top - vr.top - v.clientHeight / 2 + br.height / 2;
      const left = v.scrollLeft + br.left - vr.left - v.clientWidth / 2 + br.width / 2;
      scrollViews(left, top, true);
    }
  }
}

function refresh() { renderToolbar(); renderList(); drawBoxes(); }

// ---------- keys ----------
addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, select')) { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const list = items(), i = list.findIndex(it => it.id === st.sel);
  const it = list[i], cur = it?.type === 'f' ? it.f : null;
  // a group member selected inside its group card: decisions apply to that one finding
  const member = !it && st.sel && !isGroupSel(st.sel) ? byId().get(st.sel) : null;
  const target = it?.type === 'g' ? { ids: it.g.members.map(f => f.id), d: groupDecision(it.g), item: it.id } : (cur || member) ? { ids: [(cur || member).id], d: decisionOf(cur || member), item: (cur || member).id } : null;
  if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); const n = list[Math.min(i + 1, list.length - 1)]; if (n) select(n.id); }
  else if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); const n = list[Math.max(i - 1, 0)]; if (n) select(n.id); }
  else if (/^[1-2]$/.test(e.key) && target) { const d = DECISIONS[Number(e.key) - 1]; decide(target.ids, target.d === d ? null : d, target.item); }
  else if (e.key === '0' && target) decide(target.ids, null, target.item);
  else if (e.key === 'f' && st.sel) find(st.sel);
  else if (e.key === 'g' && groups().length) { st.view = st.view === 'groups' ? 'findings' : 'groups'; store.set('view', st.view); refresh(); }
  else if (e.key === 'n' && cur) { e.preventDefault(); st.noteOpen = cur.id; renderCard(cur.id); $(`.f[data-id="${CSS.escape(cur.id)}"] textarea`)?.focus(); }
  else if (e.key === 'm') setMode(MODES[(MODES.findIndex(m => m[0] === st.mode) + 1) % MODES.length][0]);
  else if (e.key === 'Escape' && st.sel) select(null);
  else if (e.key === 'e') { showElems = !showElems; $('#elems').checked = showElems; drawElems(); }
  else if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
  else if ((e.key === '[' || e.key === ']') && st.mode !== 'side') { st.mix = Math.max(0, Math.min(100, st.mix + (e.key === ']' ? 10 : -10))); $('#mix').value = st.mix; applyMix(); }
});

// ---------- live collaboration ----------
startLive();
onDecision((d, { mine }) => {
  if (d.comparison !== st.id) { if (!mine) liveToast(describeDecision(d)); return; }
  for (const [id, v] of Object.entries(d.decisions)) { if (v) st.decisions[id] = v; else delete st.decisions[id]; }
  refresh();
  if (!mine) liveToast(describeDecision(d));
});

renderToolbar();
renderList();
renderStage();
if (st.sel && selFindings().length) setTimeout(() => select(st.sel), 50);
else { const first = items()[0]; if (first) select(first.id, { scrollStage: false }); }
</script>
</body>
</html>
