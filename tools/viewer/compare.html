<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design vs Live</title>
<link rel="stylesheet" href="app.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  .topbar { position: static; }
  .topbar select { padding: 4px 8px; }
  .topbar .links { display: flex; gap: 6px; }
  .topbar .prog { display: flex; flex-direction: column; gap: 4px; min-width: 220px; }
  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 20px; border-bottom: 1px solid var(--line); background: var(--panel); font-size: 12.5px; }
  .toolbar input[type=search] { width: 180px; padding: 4px 8px; }
  .toolbar label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  .cats button .n { color: var(--faint); font-weight: 400; margin-left: 3px; }
  .main { flex: 1; min-height: 0; display: grid; grid-template-columns: 470px 1fr; }
  @media (max-width: 1000px) { .main { grid-template-columns: 1fr; grid-template-rows: 45% 55%; } }

  /* findings list */
  #list { overflow-y: auto; border-right: 1px solid var(--line); background: var(--bg); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .f { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; scroll-margin: 10px; }
  .f:hover { border-color: var(--line-2); }
  .f.sel { border-color: var(--focus); box-shadow: 0 0 0 1px var(--focus); }
  .f.decided:not(.sel) { opacity: .62; }
  .fh { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .fh .cat { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; flex: none; }
  .fh .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .fh .sec { flex: none; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11.5px; color: var(--faint); }
  .crops { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .crop { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .crop .lab { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .crop.d .lab { color: var(--design); } .crop.l .lab { color: var(--live); }
  .crop .lab em { font-style: normal; font-weight: 400; color: var(--faint); text-transform: none; letter-spacing: 0; }
  .crop .img { position: relative; background-repeat: no-repeat; border-radius: 6px; border: 1px solid var(--line); background-color: var(--panel-2); max-width: 100%; }
  .crop .img i { position: absolute; border: 1.5px solid; border-radius: 2px; pointer-events: none; }
  .crop.d .img i { border-color: var(--design); } .crop.l .img i { border-color: var(--live); }
  .crop .none { font-size: 12px; color: var(--faint); padding: 18px 0; text-align: center; border: 1px dashed var(--line-2); border-radius: 6px; }
  table.props { border-collapse: collapse; font-size: 12px; width: 100%; table-layout: fixed; }
  table.props td { padding: 2px 4px; vertical-align: top; overflow-wrap: anywhere; }
  table.props td:first-child { color: var(--muted); width: 30%; padding-left: 0; }
  table.props td.dv { color: var(--design); } table.props td.lv { color: var(--live); }
  table.props td.dv span, table.props td.lv span { color: var(--text); }
  table.props tr.head td { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  .fa { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .fa .spacer { flex: 1; }
  .fa a { font-size: 12px; color: var(--muted); }
  .note { width: 100%; min-height: 50px; font: inherit; font-size: 12.5px; padding: 6px 8px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--panel); color: var(--text); resize: vertical; }
  .notetext { font-size: 12.5px; color: var(--muted); white-space: pre-wrap; }
  .notetext::before { content: '✎ '; }

  /* stage */
  #stage { overflow: auto; position: relative; background: var(--panel-2); }
  .panes { display: flex; gap: 16px; padding: 12px 16px 40px; align-items: flex-start; width: max-content; min-width: 100%; }
  .pane { display: flex; flex-direction: column; gap: 6px; }
  .pane h4 { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; display: flex; gap: 8px; align-items: center; }
  .pane h4 a { font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 420px; }
  .pane.d h4 { color: var(--design); } .pane.l h4 { color: var(--live); } .pane.o h4 { color: var(--text); }
  .canvas { position: relative; background: #fff; box-shadow: 0 0 0 1px var(--line-2); isolation: isolate; overflow: hidden; }
  .canvas img { position: absolute; left: 0; top: 0; width: 100%; display: block; user-select: none; -webkit-user-drag: none; }
  .canvas img.over { z-index: 1; }
  .canvas.difference img.over { mix-blend-mode: difference; }
  .boxes { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  .boxes b { position: absolute; border: 1px solid; border-radius: 2px; pointer-events: auto; cursor: pointer; }
  .boxes b.d { border-color: color-mix(in srgb, var(--design) 55%, transparent); }
  .boxes b.l { border-color: color-mix(in srgb, var(--live) 55%, transparent); }
  .boxes b:hover { background: color-mix(in srgb, currentColor 8%, transparent); border-width: 2px; }
  .boxes b.sel { border-width: 2.5px; z-index: 3; }
  .boxes b.sel.d { border-color: var(--design); background: color-mix(in srgb, var(--design) 10%, transparent); }
  .boxes b.sel.l { border-color: var(--live); background: color-mix(in srgb, var(--live) 10%, transparent); }
  .boxes b.sel::after { content: attr(data-lab); position: absolute; left: -2px; bottom: 100%; margin-bottom: 3px; font: 600 10.5px/1.4 var(--sans); color: #fff; padding: 0 5px; border-radius: 4px; white-space: nowrap; }
  .boxes b.sel.d::after { background: var(--design); } .boxes b.sel.l::after { background: var(--live); top: 100%; bottom: auto; margin: 3px 0 0; }
  .swipe-line { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--live); z-index: 2; pointer-events: none; box-shadow: 0 0 0 1px rgba(255,255,255,.6); }
  #mix { width: 120px; }
  .hint { font-size: 11.5px; color: var(--faint); }
  .empty { padding: 40px 20px; }
</style>
</head>
<body>
<div class="topbar">
  <a class="crumb" href="./">← Comparisons</a>
  <select id="pick" title="Comparison"></select>
  <div class="links" id="links"></div>
  <span class="spacer"></span>
  <div class="prog" id="prog"></div>
  <a class="btn" id="export" download title="This comparison as Markdown (JSON: same URL with .json)">Export</a>
</div>
<div class="toolbar">
  <div class="seg cats" id="cats"></div>
  <div class="seg" id="sev" title="Minimum severity"></div>
  <div class="seg" id="status"></div>
  <input type="search" id="q" placeholder="Search text, property… ( / )">
  <select id="bulk" title="Decide every finding currently shown"><option value="">Set all shown…</option></select>
  <span class="spacer" style="flex:1"></span>
  <div class="seg" id="mode" title="m cycles"></div>
  <label id="mixLab" hidden><span id="mixName">Live</span> <input type="range" id="mix" min="0" max="100" value="50"></label>
  <div class="seg" id="zoom"></div>
  <label title="Outline every finding shown (b)"><input type="checkbox" id="allBoxes" checked> All boxes</label>
</div>
<div class="main">
  <aside id="list"></aside>
  <section id="stage"></section>
</div>
<script type="module">
import { api, esc, $, $$, swatch, viewUrl, config, editorUrl, DECISIONS, LABELS, TITLES, progressBar, legend } from './common.js';
import { startLive, onDecision, liveToast, describeDecision } from './live.js';

const CATS = ['typography', 'color', 'size', 'shape', 'spacing', 'alignment', 'icon', 'behavior', 'missing', 'extra'];
const SEVS = { high: 3, medium: 2, low: 1 };
const MODES = [['side', 'Side by side'], ['overlay', 'Overlay'], ['difference', 'Difference'], ['swipe', 'Swipe']];
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem('cmp-' + k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem('cmp-' + k, JSON.stringify(v)); } catch { } } };

const params = new URLSearchParams(location.search);
const st = {
  id: params.get('id'), report: null, decisions: {},
  cats: new Set(), minSev: store.get('minSev', 1), status: store.get('status', 'all'), q: '',
  mode: store.get('mode', 'side'), mix: 50, zoom: store.get('zoom', 'fit'), allBoxes: store.get('allBoxes', true),
  sel: params.get('f'), noteOpen: null,
};

// ---------- data ----------
const { comparisons } = await api('/api/comparisons');
const { root } = await config();
const ready = comparisons.filter(c => c.generated);
if (!st.id || !ready.some(c => c.id === st.id)) st.id = ready[0]?.id;
$('#pick').innerHTML = comparisons.map(c => `<option value="${esc(c.id)}" ${c.generated ? '' : 'disabled'} ${c.id === st.id ? 'selected' : ''}>${esc(c.label)}${c.generated ? '' : ' (not run)'}</option>`).join('');
$('#pick').onchange = e => { location.search = `?id=${encodeURIComponent(e.target.value)}`; };
if (!st.id) { $('#list').innerHTML = `<div class="empty">No comparison has been run. <code>node tools/compare.mjs run</code></div>`; throw new Error('nothing to show'); }

async function load() {
  const r = await api(`/api/comparisons/${encodeURIComponent(st.id)}`);
  st.report = r; st.decisions = r.decisions || {};
  document.title = `${r.label} · Design vs Live`;
  $('#export').href = `/api/comparisons/${encodeURIComponent(st.id)}/export.md`;
  $('#links').innerHTML = `<a class="btn small" href="${esc(r.design.view)}" target="_blank" title="${esc(r.design.page)} ${esc(JSON.stringify({ props: r.design.props, state: r.design.state }))}">Design page ↗</a><a class="btn small" href="${esc(r.live.url)}" target="_blank" title="${esc(r.live.url)}">Live page ↗</a><span class="hint" title="Re-run: node tools/compare.mjs run ${esc(r.id)}">captured ${esc(new Date(r.generatedAt).toLocaleString())}</span>`;
}
await load();

const decisionOf = f => st.decisions[f.id]?.decision || null;
function progress() {
  const p = { ...Object.fromEntries(DECISIONS.map(d => [d, 0])), undecided: 0, total: 0 };
  for (const f of st.report.findings) { p.total++; p[decisionOf(f) || 'undecided']++; }
  return p;
}
function visible() {
  const q = st.q.toLowerCase();
  return st.report.findings.filter(f => {
    if (st.cats.size && !st.cats.has(f.category)) return false;
    if (SEVS[f.severity] < st.minSev) return false;
    const d = decisionOf(f);
    if (st.status === 'todo' && d) return false;
    if (st.status === 'done' && !d) return false;
    if (st.status !== 'all' && st.status !== 'todo' && st.status !== 'done' && d !== st.status) return false;
    if (q && !`${f.text} ${f.section || ''} ${f.category} ${f.props.map(p => `${p.prop} ${p.design} ${p.live}`).join(' ')} ${st.decisions[f.id]?.note || ''}`.toLowerCase().includes(q)) return false;
    return true;
  });
}

// ---------- toolbar ----------
function renderToolbar() {
  const all = st.report.findings;
  $('#cats').innerHTML = CATS.filter(c => all.some(f => f.category === c)).map(c => `<button data-c="${c}" aria-pressed="${st.cats.has(c)}">${c}<span class="n">${all.filter(f => f.category === c).length}</span></button>`).join('');
  $('#sev').innerHTML = [[1, 'All'], [2, 'Medium+'], [3, 'High']].map(([v, l]) => `<button data-v="${v}" aria-pressed="${st.minSev === v}">${l}</button>`).join('');
  $('#status').innerHTML = [['all', 'All'], ['todo', 'To do'], ['done', 'Decided'], ...DECISIONS.map(d => [d, LABELS[d]])].map(([v, l]) => `<button data-v="${v}" class="${DECISIONS.includes(v) ? v : ''}" aria-pressed="${st.status === v}" title="${esc(TITLES[v] || '')}">${l}</button>`).join('');
  $('#mode').innerHTML = MODES.map(([v, l]) => `<button data-v="${v}" aria-pressed="${st.mode === v}">${l}</button>`).join('');
  $('#zoom').innerHTML = [['fit', 'Fit'], ['1', '100%']].map(([v, l]) => `<button data-v="${v}" aria-pressed="${st.zoom === v}">${l}</button>`).join('');
  $('#bulk').innerHTML = `<option value="">Set all shown…</option>${DECISIONS.map(d => `<option value="${d}">${LABELS[d]}</option>`).join('')}<option value="clear">Clear</option>`;
  $('#mixLab').hidden = st.mode === 'side';
  $('#mixName').textContent = st.mode === 'swipe' ? 'Swipe' : 'Live';
  $('#allBoxes').checked = st.allBoxes;
  const p = progress();
  $('#prog').innerHTML = progressBar(p) + legend(p);
}
$('#cats').onclick = e => { const b = e.target.closest('button'); if (!b) return; const c = b.dataset.c; if (e.metaKey || e.ctrlKey || e.shiftKey) st.cats.has(c) ? st.cats.delete(c) : st.cats.add(c); else st.cats = st.cats.has(c) && st.cats.size === 1 ? new Set() : new Set([c]); refresh(); };
$('#sev').onclick = e => { const b = e.target.closest('button'); if (!b) return; st.minSev = Number(b.dataset.v); store.set('minSev', st.minSev); refresh(); };
$('#status').onclick = e => { const b = e.target.closest('button'); if (!b) return; st.status = b.dataset.v; store.set('status', st.status); refresh(); };
$('#mode').onclick = e => { const b = e.target.closest('button'); if (!b) return; setMode(b.dataset.v); };
$('#zoom').onclick = e => { const b = e.target.closest('button'); if (!b) return; st.zoom = b.dataset.v; store.set('zoom', st.zoom); renderToolbar(); renderStage(); };
$('#q').oninput = e => { st.q = e.target.value; renderList(); renderStage(); };
$('#mix').oninput = e => { st.mix = Number(e.target.value); applyMix(); };
$('#allBoxes').onchange = e => { st.allBoxes = e.target.checked; store.set('allBoxes', st.allBoxes); drawBoxes(); };
$('#bulk').onchange = async e => {
  const v = e.target.value; e.target.value = '';
  if (!v) return;
  const ids = visible().map(f => f.id);
  if (!ids.length || !confirm(`${v === 'clear' ? 'Clear the decision on' : `Mark as “${LABELS[v]}”`} all ${ids.length} findings shown?`)) return;
  await decide(ids, v === 'clear' ? null : v);
};
function setMode(m) { st.mode = m; store.set('mode', m); renderToolbar(); renderStage(); }

// ---------- findings list ----------
const CROP_W = 205, CROP_H = 130, PAD = 18;
function crop(side, f, shot, box, note) {
  const r = st.report, W = r[side === 'd' ? 'design' : 'live'].width, H = r[side === 'd' ? 'design' : 'live'].height;
  const rx = Math.max(0, box.x - PAD), ry = Math.max(0, box.y - PAD);
  const rw = Math.min(W - rx, Math.max(box.w + PAD * 2, 90)), rh = Math.min(H - ry, Math.max(box.h + PAD * 2, 40));
  const s = Math.min(CROP_W / rw, CROP_H / rh, 2);
  return `<div class="img" style="width:${rw * s}px;height:${rh * s}px;background-image:url('/comparisons/${esc(r.id)}/${shot}');background-size:${W * s}px auto;background-position:${-rx * s}px ${-ry * s}px"><i style="left:${(box.x - rx) * s - 2}px;top:${(box.y - ry) * s - 2}px;width:${box.w * s + 4}px;height:${box.h * s + 4}px${note ? ';border-style:dashed' : ''}"></i></div>`;
}
function cardHtml(f) {
  const d = decisionOf(f), note = st.decisions[f.id]?.note;
  const dBox = f.design?.box || f.live.box, lBox = f.live?.box || f.design.box;
  const showText = f.liveText ? `<div class="hint">live text: “${esc(f.liveText)}”</div>` : '';
  return `<div class="f${f.id === st.sel ? ' sel' : ''}${d ? ' decided' : ''}" data-id="${esc(f.id)}">
    <div class="fh"><i class="dot ${f.severity}" title="${f.severity}"></i><span class="cat">${f.category}</span><span class="txt" title="${esc(f.text)}">${esc(f.text)}</span>${f.section ? `<span class="sec" title="${esc(f.section)}">${esc(f.section)}</span>` : ''}</div>
    <div class="crops">
      <div class="crop d"><span class="lab">Design${f.design ? '' : ' <em>same spot</em>'}</span>${crop('d', f, 'design.jpg', dBox, !f.design)}</div>
      <div class="crop l"><span class="lab">Live${f.live ? '' : ' <em>same spot</em>'}</span>${crop('l', f, 'live.jpg', lBox, !f.live)}</div>
    </div>
    <table class="props"><tr class="head"><td></td><td class="dv">Design</td><td class="lv">Live</td></tr>${f.props.map(p => `<tr><td>${esc(p.prop)}</td><td class="dv"><span>${p.swatch || p.gradient ? swatch(p.design) : ''}${esc(p.design)}</span></td><td class="lv"><span>${p.swatch || p.gradient ? swatch(p.live) : ''}${esc(p.live)}</span></td></tr>`).join('')}</table>
    ${showText}
    <div class="fa"><div class="seg">${DECISIONS.map((x, i) => `<button class="${x}" data-d="${x}" aria-pressed="${d === x}" title="${esc(TITLES[x])} (${i + 1})">${LABELS[x]}</button>`).join('')}</div>
      <button class="btn small" data-act="note" title="Add a note (n)">✎</button><span class="spacer"></span>
      ${f.design?.where ? `<a href="${esc(viewUrl({ ...st.report.design, width: st.report.design.width }, f.design.where))}" target="_blank" title="Open the design page with this element marked">design ↗</a>` : ''}
      ${f.design?.source ? `<a href="${esc(editorUrl(root, f.design.source.file, f.design.source.line, f.design.source.col))}" title="Open the source in VS Code">${esc(f.design.source.file.replace(/\.dc\.html$/, ''))}:${f.design.source.line}</a>` : ''}</div>
    ${st.noteOpen === f.id ? `<textarea class="note" placeholder="Note (saved when you leave the box)">${esc(note || '')}</textarea>` : note ? `<div class="notetext">${esc(note)}</div>` : ''}
  </div>`;
}
function renderList() {
  const list = visible();
  $('#list').innerHTML = list.length ? list.map(cardHtml).join('') : `<div class="empty">Nothing matches these filters.</div>`;
  if (st.noteOpen) $(`.f[data-id="${CSS.escape(st.noteOpen)}"] textarea`)?.focus();
}
function renderCard(id) {
  const f = st.report.findings.find(x => x.id === id), el = $(`.f[data-id="${CSS.escape(id)}"]`);
  if (f && el) el.outerHTML = cardHtml(f);
}
$('#list').addEventListener('click', e => {
  const card = e.target.closest('.f'); if (!card) return;
  const id = card.dataset.id;
  const b = e.target.closest('button[data-d]');
  if (b) { const f = st.report.findings.find(x => x.id === id); decide([id], decisionOf(f) === b.dataset.d ? null : b.dataset.d); return; }
  if (e.target.closest('[data-act=note]')) { st.noteOpen = st.noteOpen === id ? null : id; renderCard(id); $(`.f[data-id="${CSS.escape(id)}"] textarea`)?.focus(); return; }
  if (e.target.closest('a, textarea')) return;
  select(id, { scrollList: false });
});
$('#list').addEventListener('focusout', async e => {
  if (!e.target.matches('textarea.note')) return;
  const id = e.target.closest('.f').dataset.id, text = e.target.value.trim();
  st.noteOpen = null;
  if (text !== (st.decisions[id]?.note || '')) await save([id], { note: text });
  renderCard(id);
});

async function save(ids, body) {
  const res = await api(`/api/comparisons/${encodeURIComponent(st.id)}/decisions`, { method: 'PUT', body: { ids, ...body } });
  for (const [id, v] of Object.entries(res)) { if (v) st.decisions[id] = v; else delete st.decisions[id]; }
}
async function decide(ids, decision) {
  const before = visible().map(f => f.id);
  await save(ids, { decision });
  // keep moving: when the decided card drops out of the current filter, select the next one
  if (ids.length === 1 && ids[0] === st.sel) {
    const still = visible().some(f => f.id === st.sel);
    if (!still || decision) { const i = before.indexOf(st.sel); const after = visible().map(f => f.id); st.sel = after.find(id => before.indexOf(id) > i) || after[after.length - 1] || null; }
  }
  refresh();
  if (st.sel) select(st.sel);
}

// ---------- stage ----------
let scale = 1;
function stageScale(nPanes) {
  const r = st.report, avail = $('#stage').clientWidth - 32 - (nPanes - 1) * 16;
  return st.zoom === '1' ? 1 : Math.min(1, avail / nPanes / Math.max(r.design.width, r.live.width));
}
function renderStage() {
  const r = st.report, base = `/comparisons/${encodeURIComponent(r.id)}/`;
  const side = st.mode === 'side';
  scale = stageScale(side ? 2 : 1);
  const canvas = (cls, w, h, imgs) => `<div class="canvas ${cls}" style="width:${w * scale}px;height:${h * scale}px">${imgs}<div class="boxes"></div></div>`;
  if (side) {
    $('#stage').innerHTML = `<div class="panes">
      <div class="pane d"><h4>Design <a href="${esc(r.design.view)}" target="_blank">${esc(r.design.page)}</a></h4>${canvas('dc', r.design.width, r.design.height, `<img src="${base}design.jpg" alt="design">`)}</div>
      <div class="pane l"><h4>Live <a href="${esc(r.live.url)}" target="_blank">${esc(r.live.path)}</a></h4>${canvas('lc', r.live.width, r.live.height, `<img src="${base}live.jpg" alt="live">`)}</div>
    </div>`;
  } else {
    const h = Math.max(r.design.height, r.live.height);
    $('#stage').innerHTML = `<div class="panes"><div class="pane o"><h4><span style="color:var(--design)">Design</span> + <span style="color:var(--live)">Live</span> <span class="hint">${st.mode === 'difference' ? 'identical pixels are black' : st.mode === 'swipe' ? 'live to the right of the line' : 'slider sets live opacity'}</span></h4>${canvas(`oc ${st.mode}`, Math.max(r.design.width, r.live.width), h, `<img src="${base}design.jpg" alt="design"><img class="over" src="${base}live.jpg" alt="live">${st.mode === 'swipe' ? '<div class="swipe-line"></div>' : ''}`)}</div></div>`;
    $('#mix').value = st.mix;
    applyMix();
  }
  drawBoxes();
}
function applyMix() {
  const over = $('.canvas img.over'); if (!over) return;
  over.style.opacity = st.mode === 'overlay' ? st.mix / 100 : 1;
  over.style.clipPath = st.mode === 'swipe' ? `inset(0 0 0 ${st.mix}%)` : 'none';
  const line = $('.swipe-line'); if (line) line.style.left = `${st.mix}%`;
}
function boxEl(f, side, box) {
  const lab = `${f.category}: ${f.text}`.slice(0, 60);
  return `<b class="${side}${f.id === st.sel ? ' sel' : ''}" data-id="${esc(f.id)}" data-lab="${esc(lab)}" title="${esc(lab)}" style="left:${box.x * scale - 2}px;top:${box.y * scale - 2}px;width:${Math.max(box.w * scale, 2) + 4}px;height:${Math.max(box.h * scale, 2) + 4}px"></b>`;
}
function drawBoxes() {
  const list = st.allBoxes ? visible() : visible().filter(f => f.id === st.sel);
  if (st.mode === 'side') {
    $('.canvas.dc .boxes').innerHTML = list.filter(f => f.design).map(f => boxEl(f, 'd', f.design.box)).join('');
    $('.canvas.lc .boxes').innerHTML = list.filter(f => f.live).map(f => boxEl(f, 'l', f.live.box)).join('');
  } else {
    $('.canvas.oc .boxes').innerHTML = list.map(f => (f.design ? boxEl(f, 'd', f.design.box) : '') + (f.live ? boxEl(f, 'l', f.live.box) : '')).join('');
  }
}
$('#stage').addEventListener('click', e => { const b = e.target.closest('.boxes b'); if (b) select(b.dataset.id, { scrollStage: false }); });
addEventListener('resize', () => renderStage());

function select(id, { scrollList = true, scrollStage = true } = {}) {
  st.sel = id;
  const u = new URL(location.href); if (id) u.searchParams.set('f', id); else u.searchParams.delete('f'); history.replaceState(null, '', u);
  $$('.f.sel').forEach(el => el.classList.remove('sel'));
  const card = id && $(`.f[data-id="${CSS.escape(id)}"]`);
  card?.classList.add('sel');
  if (card && scrollList) card.scrollIntoView({ block: 'nearest' });
  drawBoxes();
  const f = st.report.findings.find(x => x.id === id);
  if (f && scrollStage) {
    const b = $(`.boxes b.sel`);
    if (b) {
      const stage = $('#stage'), sr = stage.getBoundingClientRect(), br = b.getBoundingClientRect();
      const top = stage.scrollTop + br.top - sr.top - stage.clientHeight / 2 + br.height / 2;
      const left = stage.scrollLeft + br.left - sr.left - stage.clientWidth / 2 + br.width / 2;
      stage.scrollTo({ top: Math.max(0, top), left: st.zoom === '1' ? Math.max(0, left) : stage.scrollLeft, behavior: 'smooth' });
    }
  }
}

function refresh() { renderToolbar(); renderList(); drawBoxes(); }

// ---------- keys ----------
addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, select')) { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const list = visible(), i = list.findIndex(f => f.id === st.sel);
  const cur = list[i];
  if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); const n = list[Math.min(i + 1, list.length - 1)]; if (n) select(n.id); }
  else if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); const n = list[Math.max(i - 1, 0)]; if (n) select(n.id); }
  else if (/^[1-4]$/.test(e.key) && cur) { const d = DECISIONS[Number(e.key) - 1]; decide([cur.id], decisionOf(cur) === d ? null : d); }
  else if (e.key === '0' && cur) decide([cur.id], null);
  else if (e.key === 'n' && cur) { e.preventDefault(); st.noteOpen = cur.id; renderCard(cur.id); $(`.f[data-id="${CSS.escape(cur.id)}"] textarea`)?.focus(); }
  else if (e.key === 'm') setMode(MODES[(MODES.findIndex(m => m[0] === st.mode) + 1) % MODES.length][0]);
  else if (e.key === 'b') { st.allBoxes = !st.allBoxes; store.set('allBoxes', st.allBoxes); renderToolbar(); drawBoxes(); }
  else if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
  else if ((e.key === '[' || e.key === ']') && st.mode !== 'side') { st.mix = Math.max(0, Math.min(100, st.mix + (e.key === ']' ? 10 : -10))); $('#mix').value = st.mix; applyMix(); }
});

// ---------- live collaboration ----------
startLive();
onDecision((d, { mine }) => {
  if (d.comparison !== st.id) { if (!mine) liveToast(describeDecision(d)); return; }
  for (const [id, v] of Object.entries(d.decisions)) { if (v) st.decisions[id] = v; else delete st.decisions[id]; }
  refresh();
  if (!mine) liveToast(describeDecision(d));
});

renderToolbar();
renderList();
renderStage();
if (st.sel && st.report.findings.some(f => f.id === st.sel)) setTimeout(() => select(st.sel), 50);
else { const first = visible()[0]; if (first) select(first.id, { scrollStage: false }); }
</script>
</body>
</html>
