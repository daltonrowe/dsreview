<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Survey</title>
<link rel="stylesheet" href="app.css">
<style>
  header.hdr { position: sticky; top: 0; z-index: 20; background: var(--bg); }
  header.hdr .topbar { position: static; backdrop-filter: none; background: var(--bg); }
  .toolbar { display: flex; gap: 10px; align-items: center; padding: 8px 20px; background: var(--bg); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .toolbar input[type=search] { width: 240px; }
  .layout { display: grid; grid-template-columns: 250px 1fr; align-items: start; }
  nav.index { position: sticky; top: var(--hdr, 98px); max-height: calc(100vh - var(--hdr, 98px)); overflow: auto; padding: 12px 8px 40px 12px; border-right: 1px solid var(--line); }
  nav.index a { display: grid; grid-template-columns: 30px 38px 1fr auto; gap: 6px; align-items: center; padding: 4px 6px; border-radius: 6px; text-decoration: none; font-size: 12.5px; }
  nav.index a:hover { background: var(--panel-2); }
  nav.index a.hidden { display: none; }
  nav.index .n { color: var(--faint); font-family: var(--mono); font-size: 11px; }
  nav.index .v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 11.5px; }
  nav.index .c { color: var(--faint); font-size: 11px; }
  nav.index .pv { display: flex; justify-content: center; transform: scale(.7); }
  main { padding: 8px 20px 120px; min-width: 0; }
  section.sec { padding-top: 18px; scroll-margin-top: calc(var(--hdr, 98px) + 4px); }
  section.sec.hidden { display: none; }
  .sec-head { display: flex; align-items: center; gap: 12px; padding: 10px 0 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .sec-head h2 { margin: 0; font-size: 18px; font-weight: 650; display: flex; align-items: baseline; gap: 10px; }
  .sec-head h2 .sn { color: var(--faint); font-family: var(--mono); font-size: 14px; font-weight: 500; }
  .sec-head h2 code { font-size: 16px; }
  .sec-head .tokens { display: flex; gap: 4px; flex-wrap: wrap; }
  .sec-head .bulk { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .item { display: flex; flex-direction: column; overflow: hidden; outline: none; scroll-margin: calc(var(--hdr, 98px) + 16px) 0 16px; }
  .item.hidden { display: none; }
  .item:focus-visible, .item.focused { box-shadow: 0 0 0 2px var(--focus); }
  .item[data-decision="keep"] { border-color: var(--keep); }
  .item[data-decision="exclude"] { border-color: var(--line-2); }
  .item[data-decision="exclude"] .shot img { opacity: .55; }
  .item-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; }
  .item-head .num { font-weight: 700; font-size: 15px; }
  .item-head .inst { margin-left: auto; color: var(--faint); font-size: 12px; }
  .where { color: var(--muted); font-size: 12.5px; line-height: 1.35; }
  .where b { color: var(--text); font-weight: 550; }
  .dec { display: flex; width: 100%; }
  .dec button { flex: 1; padding: 6px 0; }
  .foot { display: flex; gap: 14px; font-size: 12px; }
  .foot a, .foot button { color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: none; font-size: 12px; }
  .foot a:hover, .foot button:hover { color: var(--text); text-decoration: underline; }
  .shot { display: flex; align-items: center; justify-content: center; height: 170px; background: var(--checker); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); cursor: zoom-in; }
  .shot img { max-width: 100%; max-height: 100%; display: block; }
  .shot .none { color: var(--faint); font-size: 12px; }
  .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 9px; font-size: 12.5px; }
  .decl { font-family: var(--mono); font-size: 11.5px; word-break: break-word; color: var(--muted); }
  .decl .tok { color: var(--accent); }
  .decl .from { color: var(--faint); }
  .row { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
  .row .lbl { color: var(--faint); width: 64px; flex: none; }
  .links { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
  pre.src { margin: 4px 0 0; max-height: 220px; overflow: auto; font: 11px/1.5 var(--mono); background: var(--panel-2); padding: 6px 8px; border-radius: 6px; white-space: pre-wrap; word-break: break-all; }
  pre.src .hit { background: color-mix(in srgb, var(--accent) 22%, transparent); display: block; }
  .lightbox { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.8); display: none; align-items: center; justify-content: center; padding: 30px; cursor: zoom-out; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100%; max-height: 100%; background: var(--checker); box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  .lightbox .cap { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; color: #ddd; font-size: 13px; }
  .problems { margin: 14px 0; padding: 10px 14px; font-size: 12px; color: var(--muted); }
  .problems summary { cursor: pointer; }
  .item[data-decision="round"] { border-color: var(--round); }
  .tokrow { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .tokrow select { font-size: 12px; padding: 2px 6px; max-width: 100%; flex: 1; min-width: 0; font-family: var(--mono); }
  .chip.match { background: var(--keep-bg); color: var(--keep); font-family: var(--mono); font-size: 11px; }
  .chip.ontok { background: var(--keep-bg); color: var(--keep); font-weight: 600; }
  .chip.offtok { background: #fff1e0; color: #b45a00; font-weight: 600; }
  :root[data-theme="dark"] .chip.offtok { background: #3a2a14; color: #ffb366; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip.offtok { background: #3a2a14; color: #ffb366; } }
  .chip.theme-dark { background: #26262a; color: #e6e6e6; }
  .chip.theme-light { background: #f3f3ef; color: #555; border: 1px solid var(--line); }
  .chip.theme-both { background: linear-gradient(90deg, #f3f3ef 50%, #26262a 50%); color: #888; }
  .chip.near { background: var(--round-bg); color: var(--round); font-family: var(--mono); font-size: 11px; }
  nav.index .m { color: var(--keep); font-size: 11px; }
  .pmodal { position: fixed; inset: 0; z-index: 110; background: rgba(0,0,0,.55); display: none; padding: 3vh 3vw; }
  .pmodal.open { display: flex; }
  .pmodal .box { flex: 1; display: flex; flex-direction: column; background: var(--panel); border-radius: 12px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  .pmodal .bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .pmodal iframe { flex: 1; border: 0; width: 100%; }
  #suggest { margin-top: 36px; padding: 18px 20px; scroll-margin-top: calc(var(--hdr, 98px) + 8px); }
  #suggest h2 { margin: 0 0 4px; font-size: 18px; }
  #suggest .intro { color: var(--muted); font-size: 12.5px; margin: 0 0 12px; max-width: 900px; }
  #suggest .ctl { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--muted); margin-bottom: 12px; }
  #suggest .ctl input[type=number] { width: 64px; padding: 3px 6px; }
  #suggest table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  #suggest th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; padding: 6px 8px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
  #suggest td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  #suggest td.num { text-align: right; font-variant-numeric: tabular-nums; }
  #suggest tr.existing td { color: var(--muted); }
  #suggest tr.below td { opacity: .5; }
  #suggest .val { font-family: var(--mono); font-size: 12px; }
  #suggest .absorbs { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  #suggest .name { font-family: var(--mono); font-size: 12px; font-weight: 600; }
  #suggest .pvc { width: 64px; }
  #suggest .pvc > * { display: inline-block; vertical-align: middle; }
  #suggest .pvc .radius-prev { width: 26px; height: 26px; }
  #suggest .fit { display: flex; gap: 28px; margin: 4px 0 14px; flex-wrap: wrap; }
  #suggest .fit div { display: flex; flex-direction: column; gap: 2px; font-size: 12px; }
  #suggest .fit b { font-size: 18px; font-weight: 650; }
  #suggest tr.changed td { background: color-mix(in srgb, var(--round) 6%, transparent); }
  #suggest td.nowrap { white-space: nowrap; }
  #suggest .sgrad { display: inline-block; width: 14px; height: 14px; margin-right: 7px; vertical-align: -2px; border-top: 2px solid currentColor; border-left: 2px solid currentColor; opacity: .7; }
  #suggest tr.far td { background: color-mix(in srgb, var(--remove, #d93636) 6%, transparent); }
  #suggest .sgsw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
  #suggest td.delta { color: var(--round); font-weight: 600; }
  #suggest .unused { margin-top: 14px; font-size: 12.5px; color: var(--muted); }
  #suggest .bar { display: inline-block; height: 6px; border-radius: 3px; background: var(--accent); vertical-align: middle; margin-right: 6px; opacity: .7; }
  nav.index a.sugg { grid-template-columns: 1fr; margin-top: 10px; border-top: 1px solid var(--line); border-radius: 0; padding-top: 10px; font-weight: 600; }
  body.groups-mode section.sec, body.groups-mode .problems, body.groups-mode nav.index { display: none; }
  body.groups-mode .layout { grid-template-columns: 1fr; }
  body:not(.groups-mode) #gview { display: none; }
  #gview { display: flex; flex-direction: column; gap: 14px; padding-top: 16px; max-width: 1200px; margin: 0 auto; }
  .grp { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .grp[data-state="keep"] { border-color: var(--keep); }
  .grp[data-state="round"] { border-color: var(--round); }
  .grp[data-state="exclude"] { opacity: .6; }
  .grp-head { display: flex; gap: 12px; align-items: flex-start; }
  .grp-head .num { font-weight: 700; font-size: 15px; color: var(--faint); min-width: 34px; }
  .grp-title { flex: 1; min-width: 0; }
  .grp-title b { font-size: 14.5px; }
  .grp-meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .grp-meta code { font-size: 11px; }
  .gdec { width: auto; flex: none; }
  .gdec button { padding: 6px 14px; }
  .gvals { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; }
  .gv { display: inline-flex; align-items: center; gap: 6px; }
  .gv > .swatch, .gv > .radius-prev, .gv > .type-prev, .gv > .shadow-prev, .gv > .space-prev { transform: scale(.6); margin: -6px -4px; }
  .strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
  .th { flex: none; width: 150px; height: 92px; padding: 0; border: 1px solid var(--line); border-radius: 7px; background: var(--checker); cursor: zoom-in; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .th:hover { border-color: var(--focus); }
  .th img { max-width: 100%; max-height: 100%; display: block; }
  .th.more { width: 64px; font-weight: 600; color: var(--muted); background: var(--panel-2); cursor: pointer; }
  .grp-foot { display: flex; gap: 14px; align-items: center; font-size: 12.5px; }
  .linkish { background: none; border: 0; padding: 0; color: var(--focus); cursor: pointer; font-size: 12.5px; }
  .grp-list { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
  .gl-row { display: flex; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .gl-row .th { width: 120px; height: 72px; }
  .gl-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .gl-row[data-decision="exclude"] { opacity: .55; }
  .chip.dstate { text-transform: capitalize; }
  .help { font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 6px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 200; }
  .toast.show { opacity: 1; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } nav.index { display: none; } header.hdr { position: static; } }
</style>
</head>
<body>
<header class="hdr">
<div class="topbar">
  <a class="crumb" href="./">Review</a><span class="faint">/</span>
  <h1 id="title">Survey</h1>
  <span id="meta" class="muted" style="font-size:12px"></span>
  <span class="spacer"></span>
  <div id="prog" style="display:flex;align-items:center;gap:10px"></div>
  <a class="btn small" id="exp-md" target="_blank" title="Export decisions as Markdown (JSON: /export.json)">Export</a>
</div>
<div class="toolbar">
  <div class="seg" id="viewf" hidden title="Groups: one decision per part of the page. Usages: every usage on its own."><button data-v="groups">Groups</button><button data-v="usages">Usages</button></div>
  <div class="seg" id="filter">
    <button data-f="all" title="Everything except excluded">All</button><button data-f="decided" title="Kept or rounded">Decided</button><button data-f="undecided">Undecided</button><button data-f="exclude">Excluded</button>
  </div>
  <div class="seg" id="themef" hidden><button data-t="all">Both</button><button data-t="light">Light</button><button data-t="dark">Dark</button></div>
  <label class="muted" style="font-size:12.5px;display:inline-flex;gap:5px;align-items:center" title="Hide usages whose value already equals a design-system token value"><input type="checkbox" id="offtok"> Hide on-token</label>
  <span id="count" class="muted" style="font-size:12px"></span>
  <span class="spacer"></span>
</div>
</header>
<div class="layout">
  <nav class="index" id="index"></nav>
  <main id="main"><div class="empty">Loading…</div></main>
</div>
<div class="lightbox" id="lb"><img alt=""><div class="cap"></div></div>
<div class="toast" id="toast"></div>
<div class="pmodal" id="pm"><div class="box"><div class="bar"><b id="pmTitle"></b><span class="spacer"></span><a class="btn small" id="pmOpen" target="_blank">Open in tab ↗</a><button class="btn small" id="pmRound">Round to this</button><button class="btn small" id="pmClose">Close</button></div><iframe id="pmFrame"></iframe></div></div>

<script type="module">
import { api, esc, $, $$, preview, viewUrl, config, editorUrl, progressBar, legend, cssColor } from './common.js';
import { startLive, onDecision, liveToast, describeDecision } from './live.js';
import { loadTokens, nearest, familyTokenNames, scaleFor, scaleValues, kMedians, valueDistance, isColorPreset } from './tokens.js';

const setHdr = () => document.documentElement.style.setProperty('--hdr', $('header.hdr').offsetHeight + 'px');
new ResizeObserver(setHdr).observe($('header.hdr'));

const params = new URLSearchParams(location.search);
const id = params.get('id');
const state = { f: params.get('f') || 'all', theme: params.get('theme') || 'all', off: params.get('off') !== '0', view: params.get('view') || 'groups' }; // hide on-token usages unless ?off=0
let G = null; // groups.json (meta-survey), when generated
const expanded = new Set();
const groupsMode = () => !!G && state.view === 'groups';
let S, cfg, focusedId = null;
const byId = new Map();

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1400); }

async function load() {
  [S, cfg] = await Promise.all([api(`/api/surveys/${encodeURIComponent(id)}`), config(), loadTokens()]);
  document.title = `${S.title} · Survey`;
  $('#title').textContent = S.title;
  $('#meta').textContent = `${S.stats.sections} values · ${S.stats.usages} usages`;
  $('#meta').title = `${S.stats.instances} rendered instances · generated ${new Date(S.generatedAt).toLocaleString()}`;
  $('#exp-md').href = `/api/surveys/${id}/export.md`;
  const pages = [...new Set(S.captures.map(c => c.label))];
  S.themed = S.captures.some(c => c.theme === 'dark');
  // Nearest token per usage, matched against the theme(s) it was seen in: a light-mode usage can
  // only round to light values, dark to dark, and one seen in both only to theme-independent tokens.
  for (const s of S.sections) {
    const cache = {};
    for (const it of s.items) {
      it.sec = s;
      it.themes = [...new Set(it.captures.map(c => S.captures[c].theme).filter(Boolean))].sort();
      it.themeKey = !S.themed || !it.themes.length ? '' : it.themes.length > 1 ? 'both' : it.themes[0];
      it.near = (cache[it.themeKey] ??= nearest(S.preset, s.value, { theme: it.themeKey || undefined }));
      byId.set(it.id, it);
    }
    // section header / index: the match of the most common theme in the section
    const counts = {};
    for (const it of s.items) counts[it.themeKey] = (counts[it.themeKey] || 0) + 1;
    s.near = cache[Object.entries(counts).sort((a, b) => b[1] - a[1])[0][0]];
  }
  $('#themef').hidden = !S.themed;
  $('#offtok').checked = state.off;
  // meta-survey: usages grouped into parts of the page (tools/group.mjs)
  G = await fetch(`/surveys/${encodeURIComponent(id)}/groups.json`, { cache: 'no-store' }).then(r => (r.ok ? r.json() : null)).catch(() => null);
  if (G) {
    for (const g of G.groups) { g.members = g.items.map(i => byId.get(i)).filter(Boolean); for (const it of g.members) it.group = g; }
    G.groups = G.groups.filter(g => g.members.length);
    $('#viewf').hidden = false;
  }
  render();
  applyFilter();
}

function propsLabel(props) {
  // padding-top/right/bottom/left -> "padding (all sides)", etc.
  const by = {};
  for (const p of props) { const [base, side] = p.endsWith('gap') ? ['gap', p.replace('-gap', '')] : p.split('-'); (by[base] ||= []).push(side); }
  return Object.entries(by).map(([b, sides]) => b === 'gap' ? (sides.length === 2 ? 'gap' : `${sides[0]} gap`) : sides.length === 4 ? `${b} (all sides)` : `${b}-${sides.join('/')}`).join(' · ');
}
function declHtml(it) {
  if (!it.declared) return `<div class="decl" title="No authored declaration found (browser default)">browser default</div>`;
  const val = esc(it.declared).replace(/(--[\w-]+)/g, '<span class="tok">$1</span>');
  const from = (it.declaredFrom === 'inline' ? 'Inline style' : `Rule: ${it.declaredFrom}`) + (it.inheritedFrom ? ` · inherited from ${it.inheritedFrom}` : '');
  return `<div class="decl" title="${esc(from)}">${esc(it.declaredProp)}: ${val}${it.inheritedFrom ? ' <span class="from">(inherited)</span>' : ''}</div>`;
}

function tokenRow(s, it, d) {
  const n = it.near;
  if (!n || n.exact) return '';
  const saved = d.round?.to;
  let opts = n.candidates.map((c, i) => `<option value="${i}" ${saved ? (c.token === saved ? 'selected' : '') : i === 0 ? 'selected' : ''}>${esc(c.label)}</option>`).join('');
  if (saved && !n.candidates.some(c => c.token === saved)) opts = `<option value="saved" selected>→ ${esc(saved)} ${esc(d.round.value || '')} (saved)</option>` + opts;
  return `<div class="tokrow"><select class="roundsel" title="Nearest design-system tokens">${opts}</select><button class="btn small" data-preview title="Preview this token on the live page">Preview</button></div>`;
}
function chosen(it) {
  const n = it.near; if (!n) return null;
  const sel = $(`#i-${it.id} .roundsel`);
  if (sel?.value === 'saved') { const r = S.decisions[it.id].round; return { token: r.to, value: r.value, css: r.css, label: r.to }; }
  const c = n.candidates[Number(sel?.value || 0)] || n.candidates[0];
  return c && { ...c, css: cssFor(it, c) };
}
// multi-property usages (spacing) apply the token to exactly the properties that use the value
function cssFor(it, c) { return it.props?.length ? Object.fromEntries(it.props.map(p => [p, c.value])) : c.css; }
function tokBadge(it) {
  if (!it.near) return '';
  const c = it.near.candidates[0];
  return it.near.exact
    ? `<span class="chip ontok" title="Value equals design-system token ${esc(c.token)} (${esc(c.value)})">On-token</span>`
    : `<span class="chip offtok" title="No design-system token has this value. Nearest: ${esc(c.label)}">Off-token</span>`;
}
function secMatch(s) {
  if (!s.near) return '';
  const c = s.near.candidates[0];
  return s.near.exact ? `<span class="chip match" title="Equals a design-system token">= ${esc(c.token)}</span>` : `<span class="chip near" title="Nearest design-system token">≈ ${esc(c.label)}</span>`;
}

function itemHtml(s, it) {
  const d = S.decisions[it.id] || {};
  const cap = S.captures[it.where.capture];
  const src = it.source || {};
  const states = it.captures.length > 1 ? ` <span class="faint" title="${esc(it.captures.map(c => S.captures[c].label).join('\n'))}">+${it.captures.length - 1}</span>` : '';
  const elTip = `<${it.tag}> ${it.size[0]}×${it.size[1]}${it.text ? ` “${it.text}”` : ''}`;
  return `
  <article class="card item" tabindex="0" id="i-${it.id}" data-id="${it.id}" data-decision="${d.decision || ''}">
    <div class="item-head">
      <span class="num" title="S${s.n}.${it.n}">#${it.n}</span>
      ${tokBadge(it)}
      ${S.themed && it.themes.length ? `<span class="chip theme-${it.themes.length > 1 ? 'both' : it.themes[0]}">${it.themes.length > 1 ? 'Light + Dark' : it.themes[0] === 'dark' ? 'Dark' : 'Light'}</span>` : ''}
      ${it.instances > 1 ? `<span class="inst" title="Rendered instances of this element">×${it.instances}</span>` : ''}
    </div>
    <div class="shot" data-zoom>${it.shot ? `<img loading="lazy" src="/surveys/${esc(S.id)}/${esc(it.shot)}" alt="">` : '<span class="none">no screenshot</span>'}</div>
    <div class="body">
      <div class="where" title="${esc(elTip)}"><b>${esc(it.component || `<${it.tag}>`)}</b> · ${esc(cap.label)}${states}</div>
      ${it.props?.length ? `<div class="decl" title="Properties using this value">${esc(propsLabel(it.props))}</div>` : declHtml(it)}
      ${tokenRow(s, it, d)}
      <div class="seg dec">
        <button class="keep" data-d="keep" aria-pressed="${d.decision === 'keep'}">Keep</button>
        <button class="round" data-d="round" aria-pressed="${d.decision === 'round'}" ${it.near ? '' : 'disabled title="No design-system tokens for this type"'}>Round</button>
        <button class="exclude" data-d="exclude" aria-pressed="${d.decision === 'exclude'}">Exclude</button>
      </div>
    </div>
  </article>`;
}

function render() {
  $('#index').innerHTML = S.sections.map(s => `
    <a href="#s-${s.id}" data-sec="${s.id}"><span class="n">S${s.n}</span><span class="pv">${preview(S.preset, s.value)}</span><span class="v" title="${esc(s.value)}">${esc(s.value)}</span><span class="c">${s.near?.exact ? '<span class="m" title="matches a token">= </span>' : ''}${s.items.length}</span></a>`).join('') + `<a href="#suggest" class="sugg">★ Suggested Tokens</a>`;
  $('#main').innerHTML = (S.problems?.length ? `<details class="card problems"><summary>${S.problems.length} capture problem(s) during generation</summary><pre>${esc(S.problems.join('\n'))}</pre></details>` : '') +
    S.sections.map(s => `
    <section class="sec" id="s-${s.id}" data-sec="${s.id}">
      <div class="sec-head">
        ${preview(S.preset, s.value)}
        <h2><span class="sn">S${s.n}</span><code>${esc(s.value)}</code></h2>

        </div>

  $('#main').insertAdjacentHTML('afterbegin', '<div id="gview"></div>');
  renderSuggestShell();

}

function matches(it) {
  const d = S.decisions[it.id]?.decision || 'undecided';
  if (state.f === 'exclude' ? d !== 'exclude' : d === 'exclude') return false;
  if (state.f === 'decided' && !(d === 'keep' || d === 'round')) return false;
  if (state.f === 'undecided' && d !== 'undecided') return false;
  if (state.off && it.near?.exact) return false;
  if (S.themed && state.theme !== 'all' && !it.themes.includes(state.theme)) return false;
  return true;
}

function applyFilter() {
  document.body.classList.toggle('groups-mode', groupsMode());
  $$('#viewf button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === state.view));
  if (groupsMode()) { renderGroups(); syncQuery(); return; }
  $$('#filter button').forEach(b => b.setAttribute('aria-pressed', b.dataset.f === state.f));
  $$('#themef button').forEach(b => b.setAttribute('aria-pressed', b.dataset.t === state.theme));
  let shown = 0, on = 0;
  for (const s of S.sections) {
    let n = 0;
    for (const it of s.items) { const m = matches(it); $(`#i-${it.id}`).classList.toggle('hidden', !m); if (m) n++; }
    shown += n;
    on += s.items.filter(it => it.near?.exact && matches(it)).length;
    $(`#s-${s.id}`).classList.toggle('hidden', !n);
    $(`nav.index a[data-sec="${s.id}"]`).classList.toggle('hidden', !n);
    $(`#s-${s.id} .secount`).textContent = n === s.items.length ? `${n} usage${n === 1 ? '' : 's'}` : `${n} of ${s.items.length}`;
  }
  $('#count').textContent = `${shown} shown`;
  $('#count').title = S.sections.some(s => s.near) ? `${on} on-token · ${shown - on} off-token` : '';
  const q = new URLSearchParams({ id });
  if (state.f !== 'all') q.set('f', state.f);
  if (!state.off) q.set('off', '0');
  if (state.theme !== 'all') q.set('theme', state.theme);
  if (G && state.view !== 'groups') q.set('view', state.view);
  history.replaceState(null, '', `?${q}${location.hash}`);
}

function syncQuery() {
  const q = new URLSearchParams({ id });
  if (state.f !== 'all') q.set('f', state.f);
  if (!state.off) q.set('off', '0');
  if (state.theme !== 'all') q.set('theme', state.theme);
  if (G && state.view !== 'groups') q.set('view', state.view);
  history.replaceState(null, '', `?${q}${location.hash}`);
}

// ---------- Groups view (meta-survey) ----------
const decOf = it => S.decisions[it.id]?.decision || 'undecided';
function groupMembers(g) {
  // the members this view is about: theme filter applies to members
  return g.members.filter(it => !(S.themed && state.theme !== 'all' && !it.themes.includes(state.theme)));
}
function groupShown(g) {
  const mem = groupMembers(g);
  if (!mem.length) return false;
  if (state.off && mem.every(it => it.near?.exact)) return false;
  const live = mem.filter(it => decOf(it) !== 'exclude');
  if (state.f === 'exclude') return live.length === 0;
  if (!live.length) return false;
  if (state.f === 'decided') return live.every(it => decOf(it) === 'keep' || decOf(it) === 'round');
  if (state.f === 'undecided') return live.some(it => decOf(it) === 'undecided');
  return true;
}
function groupState(g) {
  const ds = g.members.map(decOf);
  const same = ds.every(d => d === ds[0]);
  return same ? ds[0] : 'mixed';
}
function themeChipOf(t) { return t ? `<span class="chip theme-${t}">${t === 'both' ? 'Light + Dark' : t === 'dark' ? 'Dark' : 'Light'}</span>` : ''; }
function nearChip(it) {
  if (!it.near) return '';
  const c = it.near.candidates[0];
  return it.near.exact ? `<span class="chip ontok" title="On-token">= ${esc(c.token)}</span>`
    : `<span class="chip near" title="Rounds to (nearest token)">→ ${esc(c.token)} · ${esc(c.value)}${c.flipsTo ? ` (dark: ${esc(c.flipsTo)})` : ''}</span>`;
}

function groupHtml(g) {
  const mem = groupMembers(g), st = groupState(g);
  const counts = { keep: 0, round: 0, exclude: 0, undecided: 0 };
  for (const it of g.members) counts[decOf(it)]++;
  const status = Object.entries(counts).filter(([, n]) => n).map(([k, n]) => `${n} ${k === 'undecided' ? 'undecided' : k === 'keep' ? 'kept' : k === 'round' ? 'rounded' : 'excluded'}`).join(' · ');
  // one chip per distinct value + theme, with its token match
  const vals = new Map();
  for (const it of mem) { const k = it.value + '|' + it.themeKey; if (!vals.has(k)) vals.set(k, { it, n: 0 }); vals.get(k).n++; }
  const valsHtml = [...vals.values()].map(({ it, n }) => `<div class="gv">${preview(S.preset, it.value)}<code>${esc(it.value)}</code>${themeChipOf(it.themeKey)}${n > 1 ? `<span class="faint">×${n}</span>` : ''}${nearChip(it)}</div>`).join('');
  const thumbs = mem.filter(it => it.shot);
  const strip = thumbs.slice(0, 8).map(it => `<button class="th" data-open-item="${it.id}" title="S${it.sec.n}.${it.n} · ${esc(it.value)} · ${esc(S.captures[it.where.capture].label)}"><img loading="lazy" src="/surveys/${esc(S.id)}/${esc(it.shot)}" alt=""></button>`).join('')
    + (thumbs.length > 8 ? `<button class="th more" data-expand>+${thumbs.length - 8}</button>` : '');
  const canRound = g.members.some(it => it.near);
  const pages = g.pages.length > 3 ? `${g.pages.slice(0, 3).join(', ')} +${g.pages.length - 3}` : g.pages.join(', ');
  const open = expanded.has(g.id);
  return `<article class="card grp" data-gid="${g.id}" data-state="${st}">
    <div class="grp-head">
      <span class="num">#${g.n}</span>
      <div class="grp-title"><b>${esc(g.label)}</b>
        <div class="grp-meta">${g.members.length} usage${g.members.length === 1 ? '' : 's'} · ${g.instances} instances · ${esc(pages)}${g.declared ? ` · <code title="As written: ${esc(g.declared)}">${esc(g.declared.length > 70 ? g.declared.slice(0, 70) + '…' : g.declared)}</code>` : ''}</div>
      </div>
      <div class="seg dec gdec">
        <button class="keep" data-gd="keep" aria-pressed="${st === 'keep'}">Keep</button>
        <button class="round" data-gd="round" aria-pressed="${st === 'round'}" ${canRound ? '' : 'disabled title="No design-system tokens for this type"'} title="Round every usage to its nearest token">Round</button>
        <button class="exclude" data-gd="exclude" aria-pressed="${st === 'exclude'}">Exclude</button>
      </div>
    </div>
    <div class="gvals">${valsHtml}</div>
    <div class="strip">${strip}</div>
    <div class="grp-foot"><button class="linkish" data-expand>${open ? 'Hide usages' : `Show all ${mem.length} usage${mem.length === 1 ? '' : 's'}`}</button><span class="faint">${status}</span></div>
    ${open ? `<div class="grp-list">${mem.map(it => `
      <div class="gl-row" data-item="${it.id}" data-decision="${decOf(it)}">
        <button class="th" data-open-item="${it.id}">${it.shot ? `<img loading="lazy" src="/surveys/${esc(S.id)}/${esc(it.shot)}" alt="">` : ''}</button>
        <div class="gl-info">
          <div><b>S${it.sec.n}.${it.n}</b> <code>${esc(it.value)}</code> ${themeChipOf(it.themeKey)} ${nearChip(it)}</div>
          <div class="faint">${esc(it.component || `<${it.tag}>`)} · ${esc(S.captures[it.where.capture].label)}${it.text ? ` · “${esc(it.text.slice(0, 50))}”` : ''}</div>
        </div>
        <span class="chip dstate">${decOf(it)}</span>
        <button class="btn small" data-open-item="${it.id}">Usage</button>
        ${it.near && !it.near.exact ? `<button class="btn small" data-preview-item="${it.id}">Preview</button>` : ''}
      </div>`).join('')}</div>` : ''}
  </article>`;
}

function renderGroups() {
  const shown = G.groups.filter(groupShown);
  $('#gview').innerHTML = shown.length ? shown.map(groupHtml).join('') : '<div class="empty">No groups match these filters.</div>';
  const usages = shown.reduce((n, g) => n + groupMembers(g).length, 0);
  $('#count').textContent = `${shown.length} groups shown`;
  $('#count').title = `${usages} usages in ${shown.length} groups (of ${G.groups.length} groups)`;
}

async function decideGroup(g, d) {
  const st = groupState(g);
  const ids = g.members.map(it => it.id);
  // pressing the active decision clears it; round only applies to usages that have tokens
  const target = st === d ? null : d;
  const apply = target === 'round' ? g.members.filter(it => it.near).map(it => it.id) : ids;
  if (target === 'round') for (const i of apply) { const sel = $(`#i-${i} .roundsel`); if (sel && sel.value !== 'saved') sel.value = '0'; }
  await decide(apply, target);
  toast(`#${g.n}: ${apply.length} usage${apply.length === 1 ? '' : 's'} → ${target || 'cleared'}`);
}

function updateProgress() {
  const p = { keep: 0, round: 0, exclude: 0, undecided: 0, total: 0 };
  for (const it of byId.values()) { p.total++; const d = S.decisions[it.id]?.decision; p[d || 'undecided']++; }
  $('#prog').innerHTML = progressBar(p) + legend(p);
  renderSuggest();
  if (groupsMode() && $('#gview')) renderGroups();
}

// ---------- Suggested Tokens: rearrange the existing tokens to fit usage ----------
// Uses every usage that isn't Excluded, at its as-designed value. For scale families the same tokens
// (same names, same count, same order) get the values that minimise total rounding distance
// (optimal weighted 1-D k-medians). Other families show how usage spreads over the existing tokens.
const sug = { by: 'usages' };
const unit = () => (S.preset === 'font-weight' ? '' : 'px');
const fmtN = n => `${Math.round(n * 100) / 100}${unit()}`;
// small inline preview next to scale values (radius: a corner with that radius)
const scalePv = n => (S.preset === 'radius' ? `<span class="sgrad" style="border-top-left-radius:${Math.min(n, 22)}px"></span>` : '');

function renderSuggestShell() {
  $('#suggest').innerHTML = `
    <h2>Suggested Tokens</h2>
    <p class="intro">${ROUNDING_PRESETS.includes(S.preset)
      ? 'Off-token values and the design-system token each should round to. Excluded usages are ignored.'
      : "How the existing tokens could be re-valued to best fit how they're used. Same tokens, same order, new values. Excluded usages are ignored."}</p>
    <div class="ctl">
      <label>Weight by <select id="sgBy"><option value="usages">usages</option><option value="instances">instances</option></select></label>
      <span class="spacer"></span>
      <button class="btn small" id="sgCopy">Copy proposal</button>
    </div>
    <div id="sgBody"></div>`;
  $('#sgBy').value = sug.by;
  $('#sgBy').addEventListener('input', () => { sug.by = $('#sgBy').value; renderSuggest(); });
  $('#sgCopy').onclick = async () => {
    const r = computeSuggest();
    if (!r?.rows) return;
    await navigator.clipboard.writeText(JSON.stringify(r.rows.map(x => ({ name: x.token, current: fmtN(x.current), proposed: fmtN(x.proposed) })), null, 2));
    toast('Copied proposal');
  };
}

function weight(it) { return sug.by === 'instances' ? it.instances : 1; }
function counted() { return [...byId.values()].filter(it => S.decisions[it.id]?.decision !== 'exclude'); }

function computeSuggest() {
  const scale = scaleFor(S.preset);
  if (!scale?.length) return null;
  // weighted points from as-designed values
  const pts = new Map();
  let total = 0;
  for (const it of counted()) {
    const xs = [...new Set(scaleValues(S.preset, it.value).map(x => Math.round(x * 100) / 100))];
    for (const x of xs) { pts.set(x, (pts.get(x) || 0) + weight(it)); total += weight(it); }
  }
  const points = [...pts].map(([x, w]) => ({ x, w })).sort((a, b) => a.x - b.x);
  const k = scale.length;
  let clusters = kMedians(points, k);
  // fewer distinct values than tokens: keep the current values of the tokens furthest from any used value
  let centers = clusters.map(c => c.center);
  if (centers.length < k) {
    const spare = scale.map(t => t.n).filter(n => !centers.includes(n))
      .sort((a, b) => Math.min(...centers.map(c => Math.abs(c - b))) - Math.min(...centers.map(c => Math.abs(c - a))))
      .slice(0, k - centers.length);
    centers = [...centers, ...spare];
  }
  centers.sort((a, b) => a - b);
  const members = new Map(clusters.map(c => [c.center, c.members]));
  const rows = scale.map((t, i) => {
    const m = members.get(centers[i]) || [];
    return { token: t.name, current: t.n, proposed: centers[i], usages: m.reduce((s, p) => s + p.w, 0), absorbs: m.filter(p => p.x !== centers[i]) };
  });
  const fit = vals => {
    let exact = 0, dist = 0;
    for (const p of points) { const d = Math.min(...vals.map(v => Math.abs(v - p.x))); if (d < 0.01) exact += p.w; dist += d * p.w; }
    return { exact: total ? exact / total : 0, avg: total ? dist / total : 0 };
  };
  return { rows, total, before: fit(scale.map(t => t.n)), after: fit(centers) };
}

// Non-scale families (colors, shadows, type styles): usage per existing token.
function computeCoverage() {
  const by = new Map();
  for (const it of counted()) {
    const c = it.near?.candidates?.[0];
    if (!c) continue;
    const key = c.token;
    const r = by.get(key) || { token: c.name || c.token, value: c.value, usages: 0, exact: 0, values: new Map() };
    r.usages += weight(it);
    if (it.near.exact) r.exact += weight(it);
    else r.values.set(it.value, (r.values.get(it.value) || 0) + weight(it));
    by.set(key, r);
  }
  for (const r of by.values()) r.suggested = suggestFor(r);
  const used = new Set([...byId.values()].flatMap(it => it.near?.candidates?.[0]?.names || [it.near?.candidates?.[0]?.token]).filter(Boolean));
  return { rows: [...by.values()].sort((a, b) => b.usages - a.usages), unused: familyTokenNames(S.preset).filter(t => !used.has(t)) };
}

// The color part of a usage value (a border value is "1px solid #e6e9ea", "bottom: …").
const colorPart = v => (S.preset === 'border' ? (String(v).match(/#[0-9a-f]{6}(?:\s*\/\s*\d+%)?/i) || [null])[0] : v);

// Suggested value for one token: the weighted medoid of the usages mapped onto it, i.e. the
// value in use that is closest (perceptually, for colors) to all of them. Exact usages count at
// the current value, and the current value wins ties so it only changes when something fits better.
// Families without a distance (shadows, …) fall back to the most-used value.
function suggestFor(r) {
  const pts = [{ v: r.value, w: r.exact }];
  for (const [v, w] of r.values) { const c = colorPart(v); if (c) pts.push({ v: c, w }); }
  const color = isColorPreset(S.preset) || S.preset === 'border';
  const dist = (a, b) => (a === b ? 0 : color ? valueDistance('background', a, b) : null);
  if (!color || pts.some(p => dist(pts[0].v, p.v) == null)) {
    const best = pts.reduce((m, p) => (p.w > m.w ? p : m), pts[0]);
    return best.v;
  }
  let best = pts[0], bestCost = Infinity;
  for (const c of pts) {
    const cost = pts.reduce((sum, p) => sum + p.w * dist(c.v, p.v), 0);
    if (cost < bestCost - 1e-9) { best = c; bestCost = cost; }
  }
  return best.v;
}

// Surveys where the palette is fixed: suggest rounding each off-token value to a token instead
// of re-valuing the tokens themselves.
const ROUNDING_PRESETS = ['background'];
const FAR = 10; // ΔE above this: probably a new color rather than a near-miss

function renderRounding() {
  // one row per off-token value and theme, since light and dark usages round to different tokens
  const groups = new Map();
  for (const sec of S.sections) for (const it of sec.items) {
    if (!it.near || it.near.exact || S.decisions[it.id]?.decision === 'exclude') continue;
    const k = sec.id + '|' + it.themeKey;
    if (!groups.has(k)) groups.set(k, { key: k, s: sec, theme: it.themeKey, c: it.near.candidates[0], its: [] });
    groups.get(k).its.push(it);
  }
  const rows = [...groups.values()].map(r => ({ ...r, usages: r.its.reduce((n, it) => n + weight(it), 0), rounded: r.its.filter(it => S.decisions[it.id]?.decision === 'round').length }))
    .sort((a, b) => b.usages - a.usages);
  renderRounding.rows = rows;
  const themeChip = t => (t ? ` <span class="chip theme-${t}">${t === 'both' ? 'Light + Dark' : t === 'dark' ? 'Dark' : 'Light'}</span>` : '');
  const swc = v => `<span class="sgsw" style="background:${esc(cssColor(v))}"></span>`;
  const total = rows.reduce((n, r) => n + r.its.length, 0), done = rows.reduce((n, r) => n + r.rounded, 0);
  $('#sgBody').innerHTML = !rows.length ? '<div class="empty">Every counted usage is already on a token.</div>' : `
    <div class="fit">
      <div><span class="faint">Off-token values</span><b>${rows.length}</b></div>
      <div><span class="faint">Usages to round</span><b>${total}</b></div>
      <div><span class="faint">Rounded so far</span><b>${done} / ${total}</b></div>
    </div>
    <table>
      <thead><tr><th>Value</th><th class="num">Usages</th><th>Round to</th><th class="num">ΔE</th><th class="num">Rounded</th><th></th></tr></thead>
      <tbody>${rows.map(r => `<tr class="${r.c.delta > FAR ? 'far' : ''}">
        <td class="absorbs nowrap">${swc(r.s.value)}<a href="#s-${r.s.id}" class="val">${esc(r.s.value)}</a> <span class="faint">S${r.s.n}</span>${themeChip(r.theme)}</td>
        <td class="num">${r.usages}</td>
        <td class="absorbs nowrap">${swc(r.c.value)}<b>${esc(r.c.token)}</b> <span class="faint">${esc(r.c.value)}</span>${r.c.flipsTo ? ` <span class="delta" title="This token changes in dark mode; the usage stays the same in both themes">dark: ${esc(r.c.flipsTo)}</span>` : ''}</td>
        <td class="num ${r.c.delta > FAR ? 'delta' : ''}" title="${r.c.delta > FAR ? 'Far from any token: consider excluding it or a new token' : 'Perceptual distance (ΔE); under ~2 is barely visible'}">${r.c.delta}</td>
        <td class="num">${r.rounded} / ${r.its.length}</td>
        <td><button class="btn small" data-roundall="${esc(r.key)}" ${r.rounded === r.its.length ? 'disabled' : ''}>Round all</button></td>
      </tr>`).join('')}</tbody>
    </table>`;
}

function renderSuggest() {
  if (!$('#sgBody')) return;
  if (ROUNDING_PRESETS.includes(S.preset)) { $('#sgCopy').hidden = true; renderRounding(); return; }
  const r = computeSuggest();
  $('#sgCopy').hidden = !r;
  if (r) {
    const pct = x => `${Math.round(x * 100)}%`;
    const maxU = Math.max(1, ...r.rows.map(x => x.usages));
    $('#sgBody').innerHTML = `
      <div class="fit">
        <div><span class="faint">On a token exactly</span><b>${pct(r.before.exact)} → ${pct(r.after.exact)}</b></div>
        <div><span class="faint">Average rounding</span><b>${fmtN(r.before.avg)} → ${fmtN(r.after.avg)}</b></div>
        <div><span class="faint">Values counted</span><b>${r.total}</b></div>
      </div>
      <table>
        <thead><tr><th>Token</th><th>Current</th><th>Suggested</th><th class="num">Change</th><th class="num">Usages</th><th>Absorbs</th></tr></thead>
        <tbody>${r.rows.map(x => {
          const d = Math.round((x.proposed - x.current) * 100) / 100;
          return `<tr class="${d ? 'changed' : ''}">
            <td class="name">${esc(x.token)}</td>
            <td class="absorbs nowrap">${scalePv(x.current)}${fmtN(x.current)}</td>
            <td class="absorbs nowrap">${d ? `${scalePv(x.proposed)}<b>${fmtN(x.proposed)}</b>` : '<span class="faint">—</span>'}</td>
            <td class="num ${d ? 'delta' : 'faint'}">${d ? (d > 0 ? '+' : '−') + fmtN(Math.abs(d)) : '—'}</td>
            <td class="num"><span class="bar" style="width:${Math.round((x.usages / maxU) * 50)}px"></span>${x.usages}</td>
            <td class="absorbs">${x.absorbs.map(p => `<span class="val" data-q="${esc(fmtN(p.x))}">${esc(fmtN(p.x))}</span> (${p.w})`).join(', ')}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>`;
    return;
  }
  const c = computeCoverage();
  const color = isColorPreset(S.preset) || S.preset === 'border';
  // "#eee" and "#eeeeee" are the same color
  const norm = v => String(v).toLowerCase().replace(/^#([0-9a-f])([0-9a-f])([0-9a-f])$/, '#$1$1$2$2$3$3');
  const sw = v => (color ? `<span class="sgsw" style="background:${esc(cssColor(v))}"></span>` : '');
  $('#sgBody').innerHTML = `<p class="intro">These tokens aren't a single scale. Each token's suggested value is the ${color ? 'color in use closest to everything mapped onto it' : 'most-used value mapped onto it'}.</p>
    <table>
      <thead><tr><th>Nearest token</th><th>Current</th><th>Suggested</th><th class="num">Usages</th><th class="num">Exact</th><th>Off-token values mapped here</th></tr></thead>
      <tbody>${c.rows.map(x => {
        const changed = norm(x.suggested) !== norm(x.value);
        return `<tr class="${changed ? 'changed' : ''}">
        <td class="name">${esc(x.token)}</td>
        <td class="absorbs nowrap">${sw(x.value)}${esc(x.value)}</td>
        <td class="absorbs nowrap">${changed ? `${sw(x.suggested)}<b>${esc(x.suggested)}</b>` : '<span class="faint">—</span>'}</td>
        <td class="num">${x.usages}</td><td class="num">${x.exact}</td>
        <td class="absorbs">${[...x.values].sort((a, b) => b[1] - a[1]).slice(0, 6).map(([v, w]) => `<span class="val" data-q="${esc(v)}">${esc(v)}</span> (${w})`).join(', ')}</td></tr>`;
      }).join('')}</tbody>
    </table>
    ${c.unused.length ? `<div class="unused"><b>Unused tokens:</b> <code>${c.unused.map(esc).join('</code>, <code>')}</code></div>` : ''}`;
}

$('#main').addEventListener('click', async e => {
  const b = e.target.closest('[data-roundall]');
  if (!b) return;
  const g = (renderRounding.rows || []).find(r => r.key === b.dataset.roundall);
  if (!g) return;
  const s = g.s, ids = g.its.map(it => it.id);
  const other = ids.filter(i => S.decisions[i]?.decision && S.decisions[i].decision !== 'round').length;
  if (other && !confirm(`${other} of these ${ids.length} usages already have a different decision. Round them anyway?`)) return;
  // round every usage to the nearest token (not a per-card dropdown choice)
  for (const i of ids) { const sel = $(`#i-${i} .roundsel`); if (sel) sel.value = '0'; }
  await decide(ids, 'round');
  toast(`S${s.n}: ${ids.length} → ${g.c.token}`);
});

async function decide(ids, decision, { note } = {}) {
  const before = ids.map(i => [i, S.decisions[i] ? { ...S.decisions[i] } : undefined]);
  for (const i of ids) {
    const cur = { ...(S.decisions[i] || {}) };
    if (decision !== undefined) { if (decision) cur.decision = decision; else delete cur.decision; }
    if (decision === 'round') { const c = chosen(byId.get(i)); cur.round = { to: c.token, value: c.value, css: c.css }; } else if (decision !== undefined) delete cur.round;
    if (note !== undefined) { if (note) cur.note = note; else delete cur.note; }
    S.decisions[i] = cur;
    paint(i);
  }
  updateProgress();
  try {
    const round = decision === 'round' ? Object.fromEntries(ids.map(i => [i, S.decisions[i].round])) : undefined;
    const res = await api(`/api/surveys/${id}/decisions`, { method: 'PUT', body: { ids, ...(decision !== undefined ? { decision: decision || null } : {}), ...(note !== undefined ? { note } : {}), ...(round ? { round } : {}) } });
    for (const [i, v] of Object.entries(res)) { if (v) S.decisions[i] = v; else delete S.decisions[i]; }
  } catch (e) {
    for (const [i, v] of before) { if (v) S.decisions[i] = v; else delete S.decisions[i]; paint(i); }
    updateProgress();
    alert('Save failed: ' + e.message);
  }
}
function paint(itemId) {
  const el = $(`#i-${itemId}`); if (!el) return;
  const d = S.decisions[itemId]?.decision || '';
  el.dataset.decision = d;
  $$('.dec button', el).forEach(b => b.setAttribute('aria-pressed', b.dataset.d === d));
}

// ---------- events ----------
$('#filter').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state.f = b.dataset.f; applyFilter(); });
$('#viewf').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state.view = b.dataset.v; applyFilter(); scrollTo({ top: 0 }); });
$('#main').addEventListener('click', e => {
  const card = e.target.closest('.grp');
  if (!card) return;
  const g = G.groups.find(x => x.id === card.dataset.gid);
  const d = e.target.closest('[data-gd]');
  if (d) { decideGroup(g, d.dataset.gd); return; }
  const o = e.target.closest('[data-open-item]');
  if (o) { if (e.metaKey || e.ctrlKey || e.shiftKey) window.open(popUrl(o.dataset.openItem, -1), '_blank'); else openUsage(o.dataset.openItem); return; }
  const pv = e.target.closest('[data-preview-item]');
  if (pv) { openPreview(pv.dataset.previewItem); return; }
  if (e.target.closest('[data-expand]')) { expanded.has(g.id) ? expanded.delete(g.id) : expanded.add(g.id); renderGroups(); }
});
$('#themef').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state.theme = b.dataset.t; applyFilter(); });
$('#offtok').addEventListener('change', e => { state.off = e.target.checked; applyFilter(); });

$('#main').addEventListener('click', async e => {
  const card = e.target.closest('.item');
  const sec = e.target.closest('section.sec');
  const bulk = e.target.closest('[data-bulk]');
  if (bulk && sec) {
    const s = S.sections.find(x => x.id === sec.dataset.sec);
    const ids = s.items.filter(matches).map(i => i.id);
    if (!ids.length) return;
    const decided = ids.filter(i => S.decisions[i]?.decision && S.decisions[i].decision !== bulk.dataset.bulk).length;
    if (decided && !confirm(`${decided} of these ${ids.length} already have a different decision. Overwrite?`)) return;
    await decide(ids, bulk.dataset.bulk || null);
    toast(`S${s.n}: ${ids.length} → ${bulk.dataset.bulk || 'cleared'}`);
    applyFilter();
    return;
  }
  if (!card) return;
  // Usage link: popover unless a modifier/middle click asks for a new tab
  if (e.target.closest('[data-open]') && !(e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0)) { e.preventDefault(); openUsage(card.dataset.id); return; }
  focus(card.dataset.id, false);
  const btn = e.target.closest('.dec button');
  if (btn) { const cur = S.decisions[card.dataset.id]?.decision; await decide([card.dataset.id], cur === btn.dataset.d ? null : btn.dataset.d); if (btn.dataset.d === 'exclude' || state.f !== 'all') setTimeout(applyFilter, 250); return; }
  if (e.target.closest('[data-zoom]')) { zoom(card.dataset.id); return; }
  if (e.target.closest('[data-preview]')) { openPreview(card.dataset.id); return; }
});
$('#main').addEventListener('change', e => {
  if (e.target.classList.contains('roundsel')) {
    // changing the target of an item already marked Round re-saves it
    const itemId = e.target.closest('.item').dataset.id;
    if (S.decisions[itemId]?.decision === 'round') decide([itemId], 'round').then(() => toast('Round target updated'));
    return;
  }
  if (!e.target.classList.contains('note')) return;
  const itemId = e.target.closest('.item').dataset.id;
  decide([itemId], undefined, { note: e.target.value.trim() }).then(() => toast('Note saved'));
});

async function toggleSource(itemId) {
  const it = byId.get(itemId), box = $(`#i-${itemId} .srcbox`);
  if (box.innerHTML) { box.innerHTML = ''; return; }
  const r = await api(`/api/source?file=${encodeURIComponent(it.source.file)}&line=${it.source.line}&context=4`);
  box.innerHTML = `<pre class="src">${r.lines.map((l, i) => `<span class="${r.from + i === r.line ? 'hit' : ''}"><span class="faint">${String(r.from + i).padStart(5)}</span>  ${esc(l)}</span>`).join('\n')}</pre>`;
}

function zoom(itemId) {
  const it = byId.get(itemId); if (!it?.shot) return;
  const lb = $('#lb');
  $('img', lb).src = `/surveys/${S.id}/${it.shot}`;
  $('.cap', lb).textContent = `S${it.sec.n}.${it.n} · ${it.value} · ${it.component || ''} · ${S.captures[it.where.capture].label}`;
  lb.classList.add('open');
}
$('#lb').addEventListener('click', () => $('#lb').classList.remove('open'));

// ---------- usage / rounding popover ----------
// Both open the live page with the item's rounding options; Usage starts on Original, Preview on the chosen token.
let pmItem = null;
function roundOptions(it) {
  const n = it.near; if (!n) return [];
  const opts = n.candidates.map(c => ({ label: `${c.token} · ${c.value}`, token: c.token, value: c.value, css: cssFor(it, c) }));
  const r = S.decisions[it.id]?.round;
  if (r?.css && !opts.some(o => o.token === r.to)) opts.unshift({ label: `${r.to} · ${r.value} (saved)`, token: r.to, value: r.value, css: r.css });
  return opts;
}
function selectedIndex(it, opts) {
  const sel = $(`#i-${it.id} .roundsel`);
  if (!sel) return 0;
  if (sel.value === 'saved') return opts.findIndex(o => o.token === S.decisions[it.id].round.to);
  const c = it.near.candidates[Number(sel.value)];
  return Math.max(0, opts.findIndex(o => o.token === c?.token));
}
function popUrl(itemId, pick) {
  const it = byId.get(itemId), opts = roundOptions(it);
  return viewUrl(S.captures[it.where.capture], it.where, opts.length ? { options: opts, pick, orig: it.value } : null);
}
function openPop(itemId, pick) {
  const it = byId.get(itemId), cap = S.captures[it.where.capture];
  pmItem = itemId;
  const url = popUrl(itemId, pick);
  $('#pmTitle').textContent = `S${it.sec.n}.${it.n} · ${it.value} · ${it.component || `<${it.tag}>`} · ${cap.label}`;
  $('#pmRound').hidden = !(pick >= 0 && roundOptions(it).length);
  if (pick >= 0) $('#pmRound').textContent = `Round to ${roundOptions(it)[pick]?.token || 'this'}`;
  $('#pmOpen').href = url;
  $('#pmFrame').src = url + '&embed=1';
  $('#pm').classList.add('open');
}
function openPreview(itemId) {
  const it = byId.get(itemId);
  if (!it.near) { toast('No token to preview'); return; }
  openPop(itemId, selectedIndex(it, roundOptions(it)));
}
function openUsage(itemId) { openPop(itemId, -1); }
// the popover reports which option is showing; mirror it on the card so "Round to this" uses it
addEventListener('message', e => {
  if (e.origin !== location.origin || e.data?.type !== 'dcv-pick' || !pmItem) return;
  const it = byId.get(pmItem), opts = roundOptions(it), pick = e.data.pick;
  $('#pmRound').hidden = !(pick >= 0);
  $('#pmOpen').href = popUrl(pmItem, pick);
  if (pick < 0) return;
  const o = opts[pick], sel = $(`#i-${pmItem} .roundsel`);
  const ci = it.near.candidates.findIndex(c => c.token === o.token);
  if (sel) sel.value = ci >= 0 ? String(ci) : 'saved';
  $('#pmRound').textContent = `Round to ${o.token}`;
});
function closePreview() { $('#pm').classList.remove('open'); $('#pmFrame').src = 'about:blank'; pmItem = null; }
$('#pmClose').onclick = closePreview;
$('#pm').addEventListener('click', e => { if (e.target.id === 'pm') closePreview(); });
$('#pmRound').onclick = async () => { const i = pmItem; closePreview(); await decide([i], 'round'); toast('Marked Round'); };
// Esc inside the iframe
$('#pmFrame').addEventListener('load', () => { try { $('#pmFrame').contentWindow.addEventListener('keydown', e => { if (e.key === 'Escape') closePreview(); }); } catch {} });

function visibleIds() { return $$('.item:not(.hidden)').filter(el => !el.closest('section.hidden')).map(el => el.dataset.id); }
function focus(itemId, scroll = true) {
  $$('.item.focused').forEach(el => el.classList.remove('focused'));
  focusedId = itemId;
  const el = itemId && $(`#i-${itemId}`);
  if (!el) return;
  el.classList.add('focused');
  if (scroll) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

document.addEventListener('keydown', e => {
  if (e.target.matches('input, select, textarea')) { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if ($('#pm').classList.contains('open')) { if (e.key === 'Escape') closePreview(); return; }
  if (groupsMode()) return;
  if (e.key === 'p' && focusedId) { openPreview(focusedId); return; }
  if ($('#lb').classList.contains('open')) { if (e.key === 'Escape' || e.key === ' ') { e.preventDefault(); $('#lb').classList.remove('open'); } return; }
  const ids = visibleIds();
  const i = ids.indexOf(focusedId);
  const map = { 1: 'keep', 2: 'round', 3: 'exclude', 0: null };
  if (e.key === '2' && focusedId && !byId.get(focusedId).near) return;
  if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); focus(ids[Math.min(i + 1, ids.length - 1)] ?? ids[0]); }
  else if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); focus(ids[Math.max(i - 1, 0)] ?? ids[0]); }
  else if (e.key in map && focusedId) {
    decide([focusedId], map[e.key]);
    // advance to the next card unless filtering would hide it anyway
    if (map[e.key]) focus(ids[i + 1] ?? focusedId);
    if (state.f !== 'all' || map[e.key] === 'exclude') setTimeout(applyFilter, 250);
  }
  else if (e.key === 'o' && focusedId) { openUsage(focusedId); }
  else if (e.key === 'O' && focusedId) { window.open(popUrl(focusedId, -1), '_blank'); }
  else if (e.key === ' ' && focusedId) { e.preventDefault(); zoom(focusedId); }
});

if (!id) $('#main').innerHTML = '<div class="empty">No survey id. <a href="./">Back</a></div>';
else load().then(startLive).catch(err => { $('#main').innerHTML = `<div class="empty">${esc(err.message)}</div>`; });

// Decisions made by other people (or this person in another tab) arrive live.
onDecision((d, { mine }) => {
  if (!S || d.survey !== S.id) { if (!mine) liveToast(describeDecision(d)); return; }
  for (const id of d.ids) {
    if (d.decisions[id]) S.decisions[id] = d.decisions[id]; else delete S.decisions[id];
    paint(id);
  }
  updateProgress();
  applyFilter();
  if (!mine) liveToast(describeDecision(d, d.ids.map(id => byId.get(id)).filter(Boolean).map(it => `S${it.sec.n}.${it.n}`)));
});
</script>
</body>
